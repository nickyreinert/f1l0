<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA core -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Calisthenics tracker with RPG progression — log workouts, earn XP, grow your tree." />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- iOS splash / tinting -->
  <meta name="msapplication-TileColor" content="#080808" />
  <meta name="msapplication-TileImage" content="icon-192.png" />

  <title>Training Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; color: #f0f0ed; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { appearance: textfield; -moz-appearance: textfield; }
    select option { background: #111; }

    @keyframes levelUp {
      0%   { transform: scale(0.6) translateY(20px); opacity: 0; }
      60%  { transform: scale(1.08) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes achievementSlide {
      0%   { transform: translateY(-80px); opacity: 0; }
      15%  { transform: translateY(0); opacity: 1; }
      80%  { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }
    @keyframes xpPulse {
      0%   { box-shadow: 0 0 0 0 rgba(184,245,0,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(184,245,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(184,245,0,0); }
    }
    @keyframes treeSway {
      0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
      25%      { transform: rotate(0.8deg); transform-origin: bottom center; }
      75%      { transform: rotate(-0.8deg); transform-origin: bottom center; }
    }
    @keyframes sparkle {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0) translateY(-30px); }
    }
    .tree-sway { animation: treeSway 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase compat SDK — config keys are intentionally public; security = Firestore Rules -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/core/storage-auth.js"></script>
  <script src="js/game/gamification.js"></script>
  <script src="js/app/loader.js"></script>
  <script src="js/core/sw-register.js"></script>
</body>
</html>
