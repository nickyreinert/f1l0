<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA core -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Training" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Calisthenics tracker with RPG progression — log workouts, earn XP, grow your tree." />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- iOS splash / tinting -->
  <meta name="msapplication-TileColor" content="#080808" />
  <meta name="msapplication-TileImage" content="icon-192.png" />

  <title>Training Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080808; color: #f0f0ed; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    select option { background: #111; }

    @keyframes levelUp {
      0%   { transform: scale(0.6) translateY(20px); opacity: 0; }
      60%  { transform: scale(1.08) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes achievementSlide {
      0%   { transform: translateY(-80px); opacity: 0; }
      15%  { transform: translateY(0); opacity: 1; }
      80%  { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }
    @keyframes xpPulse {
      0%   { box-shadow: 0 0 0 0 rgba(184,245,0,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(184,245,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(184,245,0,0); }
    }
    @keyframes treeSway {
      0%,100% { transform: rotate(0deg); transform-origin: bottom center; }
      25%      { transform: rotate(0.8deg); transform-origin: bottom center; }
      75%      { transform: rotate(-0.8deg); transform-origin: bottom center; }
    }
    @keyframes sparkle {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0) translateY(-30px); }
    }
    .tree-sway { animation: treeSway 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase compat SDK — config keys are intentionally public; security = Firestore Rules -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    // Define the storage-ready gate synchronously, BEFORE the first top-level await.
    // This script initializes Firebase asynchronously; the React layer awaits
    // window._storageReady, so it must exist before we yield — else
    // `await undefined` resolves instantly and storage reads fire before storage exists.
    let _resolveStorageReady;
    window._storageReady = new Promise(r => { _resolveStorageReady = r; });

    let _fbAuth = null;
    let _fbDb = null;

    const _bindAuthListener = () => {
      if (!_fbAuth) return;
      _fbAuth.onAuthStateChanged(async (user) => {
        window.storage._uid       = user?.uid || null;
        window._authState.user    = user;
        window._authState.syncing = !!user;
        window.dispatchEvent(new CustomEvent("authStateChanged", { detail: { ...window._authState } }));
        if (user) {
          clearTimeout(_syncReadyFallback);
          const skipSync = sessionStorage.getItem("skipCloudSync") === "1";
          console.log("[auth] user:", user.email, "skipSync:", skipSync);
          if (skipSync) {
            sessionStorage.removeItem("skipCloudSync");
            console.log("[auth] skipped cloud sync — import reload");
          } else {
            await window.storage.syncFromCloud();
          }
          window._authState.syncing = false;
          window.dispatchEvent(new CustomEvent("authStateChanged", { detail: { ...window._authState } }));
          _resolveSyncReady();
        }
      });
    };

    (async () => {
      const firebaseConfig = await fetch("/.netlify/functions/firebase-config").then(r => r.json());

      // Initialize Firebase via the already loaded compat SDK.
      const app = firebase.apps?.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
      _fbAuth = firebase.auth(app);
      window._fbAuth = _fbAuth;
      _fbDb = firebase.firestore(app);
      window._fbDb = _fbDb;
      _bindAuthListener();
    })().catch((e) => {
      console.warn("Firebase init failed:", e);
    });

    // ─── Merge helpers ────────────────────────────────────────────────────────────
    function _mergeHistories(local, cloud) {
      if (!Array.isArray(local)) return Array.isArray(cloud) ? cloud : [];
      if (!Array.isArray(cloud)) return local;
      const map = {};
      [...cloud, ...local].forEach(e => { if (e?.date) map[e.date] = e; });
      return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    // ─── Storage ─────────────────────────────────────────────────────────────────
    window.storage = {
      _uid: null,

      _col() {
        if (!_fbDb || !this._uid) return null;
        return _fbDb.collection("users").doc(this._uid).collection("data");
      },

      async get(k) {
        const v = localStorage.getItem("tp_" + k);
        return v !== null ? { key: k, value: v } : null;
      },

      // Write to localStorage + Firestore on every change
      async set(k, v) {
        const ts = Date.now();
        localStorage.setItem("tp_" + k, v);
        localStorage.setItem("tp_" + k + "_ts", String(ts)); // for sync conflict resolution
        const col = this._col();
        if (col) col.doc(k).set({ value: v, ts }).catch(() => {});
        return { key: k, value: v };
      },

      async delete(k) {
        localStorage.removeItem("tp_" + k);
        const col = this._col();
        if (col) col.doc(k).delete().catch(() => {});
        return { key: k, deleted: true };
      },

      async list(prefix) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith("tp_" + (prefix || "")) && !k.endsWith("_ts")) keys.push(k.slice(3));
        }
        return { keys };
      },

      // Push every local key up to Firestore (used after import).
      async _pushAllToCloud() {
        const col = this._col();
        if (!col) return;
        const batch = _fbDb.batch();
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k?.startsWith("tp_") && !k.endsWith("_ts")) {
            batch.set(col.doc(k.slice(3)), { value: localStorage.getItem(k), ts: Date.now() });
          }
        }
        await batch.commit();
      },

      // On login: load everything from Firestore into localStorage, then re-init UI
      async syncFromCloud() {
        const col = this._col();
        if (!col) return;
        try {
          const snap = await col.get();
          if (snap.empty) {
            // No cloud data yet — push local up
            const batch = _fbDb.batch();
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k?.startsWith("tp_") && !k.endsWith("_ts")) {
                batch.set(col.doc(k.slice(3)), { value: localStorage.getItem(k), ts: Date.now() });
              }
            }
            await batch.commit();
            return;
          }
          // Merge: for sessions, union by date picking the newest updatedAt per
          // entry. For everything else, highest doc-level ts wins.
          snap.forEach(cloudDoc => {
            const key    = cloudDoc.id;
            const cldVal = cloudDoc.data().value;
            const cldTs  = cloudDoc.data().ts || 0;
            const locKey = "tp_" + key;
            const locVal = localStorage.getItem(locKey);

            if (key === "sessions") {
              const loc = locVal ? JSON.parse(locVal) : [];
              const cld = JSON.parse(cldVal);
              // Union by date. When a date exists on both sides, the one with the
              // newer per-session updatedAt wins — this is what makes a workout
              // logged on one device show up on another *the same day*. Sessions
              // saved before updatedAt existed are treated as oldest (0), so a
              // freshly-stamped edit from either device always takes precedence.
              const map = {};
              const consider = (s) => {
                const prev = map[s.date];
                if (!prev || (s.updatedAt || 0) >= (prev.updatedAt || 0)) map[s.date] = s;
              };
              cld.forEach(consider);
              loc.forEach(consider);
              const merged = Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
              localStorage.setItem(locKey, JSON.stringify(merged));
            } else {
              // For non-session keys: cloud wins (it's the authoritative remote copy)
              // unless we have a newer local write (compare timestamps)
              const locTs = parseInt(localStorage.getItem(locKey + "_ts") || "0");
              if (!locVal || cldTs > locTs) {
                localStorage.setItem(locKey, cldVal);
              }
            }
          });
          window.dispatchEvent(new CustomEvent("cloudSyncComplete"));
        } catch(e) {
          console.warn("Cloud sync error:", e);
        }
      }
    };

    _resolveStorageReady(); // storage object is now fully set up

    // ─── Auth state ───────────────────────────────────────────────────────────────
    window._authState = { user: null, syncing: false };

    // _syncReady resolves once we know the FINAL auth state and (if logged in)
    // the first cloud sync has finished. The initial onAuthStateChanged often
    // fires with user=null before the persisted session is restored, so we must
    // not resolve on that first null — we wait for the real resolution.
    let _resolveSyncReady, _syncReadyResolved = false;
    window._syncReady = new Promise(r => {
      _resolveSyncReady = () => { if (!_syncReadyResolved) { _syncReadyResolved = true; r(); } };
    });
    // Fallback: if auth never restores a user within 1.5s, unblock the UI anyway.
    const _syncReadyFallback = setTimeout(() => _resolveSyncReady(), 1500);

    window._signInWithGoogle = async () => {
      if (!_fbAuth) return;
      const provider = new firebase.auth.GoogleAuthProvider();
      await _fbAuth.signInWithPopup(provider);
    };

    window._signOut = async () => {
      if (!_fbAuth) return;
      await _fbAuth.signOut();
      window.storage._uid = null;
    };
  </script>

  <script>
  // ═══════════════════════════════════════════════════════════════════════════════
  // GAMIFICATION ENGINE
  // ═══════════════════════════════════════════════════════════════════════════════

  // ─── StorageManager ──────────────────────────────────────────────────────────
  window.StorageManager = {
    async get(key) {
      try {
        const r = await window.storage.get("rpg_" + key);
        return r ? JSON.parse(r.value) : null;
      } catch { return null; }
    },
    async set(key, val) {
      try { await window.storage.set("rpg_" + key, JSON.stringify(val)); } catch {}
    },
    async getAll() {
      const keys = ["xp","level","streaks","recovery","achievements","exerciseHistory","statistics"];
      const out = {};
      for (const k of keys) { out[k] = await this.get(k); }
      return out;
    }
  };

  // ─── XPManager ───────────────────────────────────────────────────────────────
  window.XPManager = {
    XP_VALUES: {
      workout:              50,
      morning:              20,
      weeklyConsistency:   200,
      pr:                   50,
      improvementSmall:      5,
      improvementModerate:  15,
      improvementMajor:     25,
    },

    async getState() {
      return await StorageManager.get("xp") || { total: 0, history: [] };
    },

    async award(amount, reason) {
      const state = await this.getState();
      state.total += amount;
      state.history.push({ amount, reason, date: new Date().toISOString().slice(0,10), ts: Date.now() });
      if (state.history.length > 500) state.history = state.history.slice(-500);
      await StorageManager.set("xp", state);
      return state.total;
    },

    async getTotal() {
      const s = await this.getState();
      return s.total;
    }
  };

  // ─── LevelManager ────────────────────────────────────────────────────────────
  window.LevelManager = {
    calcLevel(totalXP) {
      return Math.floor(Math.sqrt(totalXP / 100)) + 1;
    },

    xpForLevel(level) {
      return Math.pow(level - 1, 2) * 100;
    },

    xpForNextLevel(level) {
      return Math.pow(level, 2) * 100;
    },

    progressToNext(totalXP) {
      const level     = this.calcLevel(totalXP);
      const currentFloor = this.xpForLevel(level);
      const nextFloor    = this.xpForNextLevel(level);
      const span         = nextFloor - currentFloor;
      const earned       = totalXP - currentFloor;
      return { level, current: earned, needed: span, pct: Math.min(100, (earned / span) * 100) };
    },

    async getState() {
      return await StorageManager.get("level") || { level: 1, leveledUpAt: null };
    },

    async sync(totalXP) {
      const state     = await this.getState();
      const newLevel  = this.calcLevel(totalXP);
      const didLevel  = newLevel > state.level;
      if (newLevel > state.level) {
        state.level      = newLevel;
        state.leveledUpAt = Date.now();
        await StorageManager.set("level", state);
      }
      return { state, didLevel, newLevel };
    },

    treeStage(level) {
      if (level < 5)  return { name: "Seed",        stage: 0 };
      if (level < 10) return { name: "Sprout",       stage: 1 };
      if (level < 20) return { name: "Young Tree",   stage: 2 };
      if (level < 40) return { name: "Mature Tree",  stage: 3 };
      if (level < 60) return { name: "Large Tree",   stage: 4 };
      return              { name: "Ancient Tree",  stage: 5 };
    }
  };

  // ─── StreakManager ────────────────────────────────────────────────────────────
  window.StreakManager = {
    async getState() {
      return await StorageManager.get("streaks") || {
        current: 0,
        longest: 0,
        totalActiveDays: 0,
        lastActiveDate: null,
        activeDates: []
      };
    },

    async recordActiveDay(dateStr) {
      const state  = await this.getState();
      const recovery = await RecoveryManager.getState();

      if (state.activeDates.includes(dateStr)) return { state, wasNew: false };

      state.activeDates.push(dateStr);
      if (state.activeDates.length > 1000) state.activeDates = state.activeDates.slice(-1000);

      const yesterday = this._offsetDate(dateStr, -1);
      const dayBefore  = this._offsetDate(dateStr, -2);

      const wasActiveYesterday = state.activeDates.includes(yesterday);
      const wasActiveDay2      = state.activeDates.includes(dayBefore);
      const recoveryUsedYday   = (recovery.usedDates || []).includes(yesterday);
      const recoveryUsedDay2   = (recovery.usedDates || []).includes(dayBefore);

      if (wasActiveYesterday || recoveryUsedYday) {
        state.current++;
      } else if (wasActiveDay2 && recoveryUsedYday) {
        state.current++;
      } else {
        state.current = 1;
      }

      state.longest        = Math.max(state.longest, state.current);
      state.totalActiveDays = (state.totalActiveDays || 0) + 1;
      state.lastActiveDate  = dateStr;

      await StorageManager.set("streaks", state);
      return { state, wasNew: true };
    },

    _offsetDate(dateStr, days) {
      const d = new Date(dateStr + "T12:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }
  };

  // ─── RecoveryManager ─────────────────────────────────────────────────────────
  window.RecoveryManager = {
    MAX_RECOVERY: 2,
    WINDOW_DAYS: 14,

    async getState() {
      return await StorageManager.get("recovery") || {
        usedDates: [],
        totalUsed: 0
      };
    },

    async useRecoveryDay(dateStr) {
      const state   = await this.getState();
      const streaks = await StreakManager.getState();

      if (state.usedDates.includes(dateStr)) return { ok: false, reason: "already_used" };

      const available = await this.getAvailable();
      if (available <= 0) return { ok: false, reason: "none_available" };

      state.usedDates.push(dateStr);
      state.totalUsed = (state.totalUsed || 0) + 1;
      await StorageManager.set("recovery", state);

      // Extend the streak
      if (streaks.current > 0) {
        streaks.current++;
        streaks.longest = Math.max(streaks.longest, streaks.current);
        await StorageManager.set("streaks", streaks);
      }

      return { ok: true };
    },

    async getAvailable() {
      const state   = await this.getState();
      const cutoff  = new Date();
      cutoff.setDate(cutoff.getDate() - this.WINDOW_DAYS);
      const cutoffStr = cutoff.toISOString().slice(0, 10);
      const usedInWindow = (state.usedDates || []).filter(d => d >= cutoffStr).length;
      return Math.max(0, this.MAX_RECOVERY - usedInWindow);
    }
  };

  // ─── ProgressionAnalyzer ─────────────────────────────────────────────────────
  window.ProgressionAnalyzer = {
    async getHistory() {
      return await StorageManager.get("exerciseHistory") || {};
    },

    async recordSession(exerciseName, value, metric, date) {
      const hist = await this.getHistory();
      if (!hist[exerciseName]) hist[exerciseName] = [];
      hist[exerciseName].push({ value, metric, date, ts: Date.now() });
      if (hist[exerciseName].length > 500) hist[exerciseName] = hist[exerciseName].slice(-500);
      await StorageManager.set("exerciseHistory", hist);
    },

    async analyze(exerciseName, currentValue) {
      const hist       = await this.getHistory();
      const sessions   = (hist[exerciseName] || []).slice(0, -1); // exclude just-recorded
      if (sessions.length === 0) return { isPR: true, improvement: null, xpBonus: XPManager.XP_VALUES.pr };

      const allVals   = sessions.map(s => s.value);
      const pr        = Math.max(...allVals);
      const isPR      = currentValue > pr;

      // Recent 30-day avg
      const cutoff    = new Date(); cutoff.setDate(cutoff.getDate() - 30);
      const cutoffStr = cutoff.toISOString().slice(0, 10);
      const recent    = sessions.filter(s => s.date >= cutoffStr).map(s => s.value);
      const recentAvg = recent.length > 0 ? recent.reduce((a,b) => a+b, 0) / recent.length : null;

      if (isPR) {
        return { isPR: true, improvement: recentAvg ? ((currentValue - recentAvg) / recentAvg) * 100 : null,
                 xpBonus: XPManager.XP_VALUES.pr };
      }

      if (recentAvg !== null) {
        const pct = ((currentValue - recentAvg) / recentAvg) * 100;
        if (pct >= 20)  return { isPR: false, improvement: pct, xpBonus: XPManager.XP_VALUES.improvementMajor };
        if (pct >= 10)  return { isPR: false, improvement: pct, xpBonus: XPManager.XP_VALUES.improvementModerate };
        if (pct >= 5)   return { isPR: false, improvement: pct, xpBonus: XPManager.XP_VALUES.improvementSmall };
      }

      return { isPR: false, improvement: null, xpBonus: 0 };
    },

    async getBest30Days(exerciseName) {
      const hist    = await this.getHistory();
      const sessions = hist[exerciseName] || [];
      const cutoff  = new Date(); cutoff.setDate(cutoff.getDate() - 30);
      const cutoffStr = cutoff.toISOString().slice(0, 10);
      const recent  = sessions.filter(s => s.date >= cutoffStr).map(s => s.value);
      return recent.length > 0 ? Math.max(...recent) : null;
    },

    async getAllTimePR(exerciseName) {
      const hist   = await this.getHistory();
      const vals   = (hist[exerciseName] || []).map(s => s.value);
      return vals.length > 0 ? Math.max(...vals) : null;
    }
  };

  // ─── StatisticsManager ───────────────────────────────────────────────────────
  window.StatisticsManager = {
    async getState() {
      return await StorageManager.get("statistics") || {
        totalXP: 0,
        totalWorkouts: 0,
        totalActiveDays: 0,
        totalMinutes: 0,
        totalReps: 0,
        totalDistance: 0,
        totalPRs: 0,
        totalRecoveryDaysUsed: 0,
        exerciseTotals: {}
      };
    },

    async record({ xpEarned, reps, exerciseName, isPR, isMorning }) {
      const stats = await this.getState();
      stats.totalXP          = (stats.totalXP || 0) + (xpEarned || 0);
      stats.totalReps        = (stats.totalReps || 0) + (reps || 0);
      if (isPR) stats.totalPRs = (stats.totalPRs || 0) + 1;
      if (exerciseName && reps) {
        if (!stats.exerciseTotals) stats.exerciseTotals = {};
        stats.exerciseTotals[exerciseName] = (stats.exerciseTotals[exerciseName] || 0) + reps;
      }
      await StorageManager.set("statistics", stats);
      return stats;
    },

    async recordWorkoutComplete(isMorning) {
      const stats = await this.getState();
      if (isMorning) {
        // morning counted in active days
      } else {
        stats.totalWorkouts = (stats.totalWorkouts || 0) + 1;
      }
      await StorageManager.set("statistics", stats);
    },

    async recordActiveDayComplete() {
      const stats = await this.getState();
      stats.totalActiveDays = (stats.totalActiveDays || 0) + 1;
      await StorageManager.set("statistics", stats);
    },

    async addXP(amount) {
      const stats = await this.getState();
      stats.totalXP = (stats.totalXP || 0) + amount;
      await StorageManager.set("statistics", stats);
    }
  };

  // ─── AchievementManager ──────────────────────────────────────────────────────
  window.AchievementManager = {
    DEFINITIONS: [
      // Consistency
      { id: "first_workout",    label: "First Step",         desc: "Logged your first workout",          icon: "🏋️", hidden: false, check: (s) => s.totalWorkouts >= 1 },
      { id: "streak_7",         label: "7-Day Streak",       desc: "7 consecutive active days",          icon: "🔥", hidden: false, check: (_, str) => str.current >= 7 || str.longest >= 7 },
      { id: "streak_30",        label: "30-Day Streak",      desc: "30 consecutive active days",         icon: "💫", hidden: false, check: (_, str) => str.current >= 30 || str.longest >= 30 },
      { id: "streak_100",       label: "Century",            desc: "100 consecutive active days",        icon: "👑", hidden: false, check: (_, str) => str.current >= 100 || str.longest >= 100 },
      // Progress
      { id: "first_pr",         label: "Personal Best",      desc: "First personal record",              icon: "⭐", hidden: false, check: (s) => s.totalPRs >= 1 },
      { id: "pr_10",            label: "10 Records",         desc: "Smashed 10 personal records",        icon: "🌟", hidden: false, check: (s) => s.totalPRs >= 10 },
      { id: "pr_50",            label: "50 Records",         desc: "50 personal records broken",         icon: "✨", hidden: true,  check: (s) => s.totalPRs >= 50 },
      // Volume
      { id: "pushups_1k",       label: "Push-up Thousand",   desc: "1,000 total pushups",                icon: "💪", hidden: false, check: (s) => ((s.exerciseTotals?.["Push-ups"] || 0) + (s.exerciseTotals?.["Liegestütze"] || 0)) >= 1000 },
      { id: "pushups_10k",      label: "Push-up Legend",     desc: "10,000 total pushups",               icon: "🦾", hidden: true,  check: (s) => ((s.exerciseTotals?.["Push-ups"] || 0) + (s.exerciseTotals?.["Liegestütze"] || 0)) >= 10000 },
      { id: "squats_1k",        label: "Squat Master",       desc: "1,000 total squats",                 icon: "🦵", hidden: false, check: (s) => ((s.exerciseTotals?.["Squats"] || 0) + (s.exerciseTotals?.["Kniebeugen"] || 0)) >= 1000 },
      { id: "reps_10k",         label: "Volume King",        desc: "10,000 total reps",                  icon: "🏆", hidden: true,  check: (s) => s.totalReps >= 10000 },
      // Levels
      { id: "level_5",          label: "Level 5",            desc: "Reached level 5 — Sprout",           icon: "🌱", hidden: false, check: (_, __, lv) => lv >= 5 },
      { id: "level_10",         label: "Level 10",           desc: "Reached level 10 — Young Tree",      icon: "🌿", hidden: false, check: (_, __, lv) => lv >= 10 },
      { id: "level_25",         label: "Level 25",           desc: "Reached level 25 — Mature Tree",     icon: "🌳", hidden: false, check: (_, __, lv) => lv >= 25 },
      { id: "level_50",         label: "Level 50",           desc: "Reached level 50 — Large Tree",      icon: "🌲", hidden: true,  check: (_, __, lv) => lv >= 50 },
      // Dedication
      { id: "active_30",        label: "Month Warrior",      desc: "30 total active days",               icon: "📅", hidden: false, check: (s) => s.totalActiveDays >= 30 },
      { id: "active_100",       label: "100 Days",           desc: "100 total active days",              icon: "💯", hidden: false, check: (s) => s.totalActiveDays >= 100 },
      { id: "active_365",       label: "One Year",           desc: "365 total active days",              icon: "🗓️", hidden: true,  check: (s) => s.totalActiveDays >= 365 },
    ],

    async getState() {
      return await StorageManager.get("achievements") || { unlocked: {}, history: [] };
    },

    async check(stats, streaks, level) {
      const state  = await this.getState();
      const newly  = [];
      for (const def of this.DEFINITIONS) {
        if (state.unlocked[def.id]) continue;
        if (def.check(stats, streaks, level)) {
          state.unlocked[def.id] = Date.now();
          state.history.push({ id: def.id, unlockedAt: Date.now(), date: new Date().toISOString().slice(0,10) });
          newly.push(def);
        }
      }
      if (newly.length > 0) await StorageManager.set("achievements", state);
      return { state, newly };
    },

    getDefinition(id) {
      return this.DEFINITIONS.find(d => d.id === id);
    }
  };

  // ─── Main Gamification Orchestrator ──────────────────────────────────────────
  window.Gamification = {
    async processWorkoutComplete({ exerciseSessions, isMorning, date }) {
      const today    = date || new Date().toISOString().slice(0, 10);
      const slotKey  = today + (isMorning ? ":morning" : ":training");

      // Guard: only process each slot once per day
      const processed = await StorageManager.get("processedSlots") || [];
      if (processed.includes(slotKey)) {
        return { events: [], totalXP: 0, newTotal: await XPManager.getTotal(), newLevel: (await LevelManager.getState()).level };
      }
      processed.push(slotKey);
      if (processed.length > 200) processed.splice(0, processed.length - 200);
      await StorageManager.set("processedSlots", processed);

      const events   = [];
      let totalXP    = 0;
      let newPRs     = 0;

      // 1. Award base XP
      const baseXP = isMorning ? XPManager.XP_VALUES.morning : XPManager.XP_VALUES.workout;
      totalXP += baseXP;
      events.push({ type: "xp", amount: baseXP, reason: isMorning ? "Morning Workout" : "Training" });

      // 2. Analyze exercise progressions
      for (const { name, reps } of (exerciseSessions || [])) {
        if (!name || !reps || reps <= 0) continue;
        const analysis = await ProgressionAnalyzer.analyze(name, reps);
        await ProgressionAnalyzer.recordSession(name, reps, "reps", today);

        if (analysis.xpBonus > 0) {
          totalXP += analysis.xpBonus;
          events.push({ type: analysis.isPR ? "pr" : "improvement", name, reps, analysis });
          if (analysis.isPR) newPRs++;
        }

        await StatisticsManager.record({ reps, exerciseName: name, isPR: analysis.isPR });
      }

      // 3. Award XP
      const newTotal = await XPManager.award(totalXP, "workout");
      await StatisticsManager.addXP(totalXP);

      // 4. Level sync
      const { didLevel, newLevel } = await LevelManager.sync(newTotal);
      if (didLevel) events.push({ type: "levelUp", level: newLevel });

      // 5. Streak
      const { wasNew } = await StreakManager.recordActiveDay(today);

      // 6. Weekly consistency check
      if (!isMorning && wasNew) {
        const streakState = await StreakManager.getState();
        if (streakState.current > 0 && streakState.current % 7 === 0) {
          const bonusXP = XPManager.XP_VALUES.weeklyConsistency;
          await XPManager.award(bonusXP, "weekly_consistency");
          await StatisticsManager.addXP(bonusXP);
          totalXP += bonusXP;
          events.push({ type: "weeklyBonus", amount: bonusXP });
        }
      }

      // 7. Record workout
      await StatisticsManager.recordWorkoutComplete(isMorning);
      if (!isMorning) await StatisticsManager.recordActiveDayComplete();

      // 8. Check achievements
      const stats   = await StatisticsManager.getState();
      const streaks = await StreakManager.getState();
      const { newly } = await AchievementManager.check(stats, streaks, newLevel);
      if (newly.length > 0) events.push({ type: "achievements", list: newly });

      return { events, totalXP, newTotal, newLevel };
    },

    async getSnapshot() {
      const [xpState, levelState, streakState, recoveryState, achState, stats] = await Promise.all([
        XPManager.getState(),
        LevelManager.getState(),
        StreakManager.getState(),
        RecoveryManager.getState(),
        AchievementManager.getState(),
        StatisticsManager.getState()
      ]);
      const total     = xpState.total || 0;
      const level     = LevelManager.calcLevel(total);
      const progress  = LevelManager.progressToNext(total);
      const available = await RecoveryManager.getAvailable();
      return { xpState, level, progress, streakState, recoveryState, available, achState, stats };
    }
  };
  </script>

  <script type="text/plain" id="app-script">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ─── Storage ────────────────────────────────────────────────────────────────
    async function load(key) {
      try {
        await window._storageReady;
        const r = await window.storage.get(key);
        return r ? JSON.parse(r.value) : null;
      } catch(e) { console.error("[load] failed for key:", key, e); return null; }
    }
    async function save(key, val) {
      try { await window._storageReady; await window.storage.set(key, JSON.stringify(val)); } catch {}
    }

    // ─── Helpers ────────────────────────────────────────────────────────────────
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
    function fmtDate(s) { return new Date(s + "T12:00:00").toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "long" }); }
    function computeType(ld, lt) { return (!ld || ld !== yesterdayStr()) ? "A" : (lt === "A" ? "B" : "A"); }
    function fmtMs(ms) { const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000); return h > 0 ? `${h}h ${m}m` : `${m}m`; }
    function dateOffsetStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }

    // Resize an image File to a small JPEG data-URL for exercise illustration thumbnails.
    // Keeps images well under Firestore's 1 MB document limit (~8-12 KB per image at 96 px).
    function resizeImageToDataURL(file, maxDim) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const ratio = Math.min(maxDim / img.width, maxDim / img.height, 1);
          const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.65));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img load failed')); };
        img.src = url;
      });
    }

    // ─── Stats helpers ───────────────────────────────────────────────────────────
    function calcStreak(history) {
      if (!history.length) return { cur: 0, best: 0 };
      // Build a date→session map (one session per date).
      const byDate = {};
      history.forEach(s => { byDate[s.date] = s; });
      const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

      let best = 0, cur = 0, runTrain = 0, inCurrent = true;
      // Start from today if logged, otherwise yesterday (streak still alive).
      let expected = dates[0] === todayStr() ? todayStr() : yesterdayStr();

      for (const d of dates) {
        if (d !== expected) {
          // Calendar gap → streak broken.
          if (inCurrent) { cur = runTrain; inCurrent = false; }
          best = Math.max(best, runTrain);
          runTrain = 0;
          expected = d; // start a new (older) run from here
        }
        // Rest days (type B) bridge the gap but don't count as streak days.
        if ((byDate[d]?.type ?? 'A') === 'A') runTrain++;
        const dd = new Date(expected + "T12:00:00"); dd.setDate(dd.getDate() - 1);
        expected = dd.toISOString().slice(0, 10);
      }
      best = Math.max(best, runTrain);
      if (inCurrent) cur = runTrain;
      return { cur, best };
    }
    // ─── Session model (schema 3) ────────────────────────────────────────────────
    // A session = one date. Two flat exercise arrays: mornExercises[] + exercises[].
    // No blocks, no slots, no completedAt timestamps — just reps.

    const flatExs = (arr) => (arr || []).map(ex => ({
      name: ex.name,
      reps: (Array.isArray(ex.reps) ? ex.reps : []).filter(v => typeof v === 'number' && v > 0),
    }));

    // All exercises from a session (both sections) — used for stats/gamification.
    function sessionExercises(session) {
      const flatMap = {};
      [...flatExs(session?.mornExercises), ...flatExs(session?.exercises)].forEach(ex => {
        if (!flatMap[ex.name]) flatMap[ex.name] = { name: ex.name, reps: [] };
        flatMap[ex.name].reps.push(...ex.reps);
      });

      // Import/legacy safety: some sessions may have richer trainBlocks data while
      // flat exercises[] is stale or incomplete. Fill only missing exercise names
      // from blocks to avoid double-counting when both sources are in sync.
      const blockMap = {};
      const blocks = Array.isArray(session?.trainBlocks)
        ? session.trainBlocks
        : (session?.blocks || []);
      blocks.forEach(b => (b.exercises || []).forEach(ex => {
        const reps = (Array.isArray(ex.reps) ? ex.reps : []).filter(v => typeof v === 'number' && v > 0);
        if (!reps.length) return;
        if (!blockMap[ex.name]) blockMap[ex.name] = { name: ex.name, reps: [] };
        blockMap[ex.name].reps.push(...reps);
      }));

      const merged = { ...flatMap };
      Object.keys(blockMap).forEach((name) => {
        if (!merged[name] || merged[name].reps.length === 0) merged[name] = blockMap[name];
      });

      return Object.values(merged);
    }
    const exTotalReps = ex => (Array.isArray(ex.reps) ? ex.reps : []).reduce((a,v) => a + (v || 0), 0);
    const exSetCount  = ex => (Array.isArray(ex.reps) ? ex.reps : []).filter(v => v > 0).length;
    function sessionTotalReps(session) { return sessionExercises(session).reduce((a,ex) => a + exTotalReps(ex), 0); }

    // Migrate schema 2 (blocks) → schema 3 (mornExercises + exercises)
    function migrateSession(s) {
      if (Array.isArray(s.exercises) || Array.isArray(s.mornExercises)) {
        // Backfill per-exercise `done` (added later). An exercise counts as done if
        // it already has the flag, or its section/session was marked complete.
        const fill = (exs, sectionDone) => (exs || []).map(ex =>
          typeof ex.done === "boolean" ? ex : { ...ex, done: !!(sectionDone || s.done) });
        return {
          ...s,
          exercises:     fill(s.exercises, s.done),
          mornExercises: fill(s.mornExercises, s.mornDone),
        };
      }
      const toFlat = (exs) => exs.map(ex => ({ name: ex.name, target: ex.reps[0]||10, reps: ex.reps, done: true }));
      const mornMap = {}, mainMap = {};
      (s.blocks || []).forEach(b => {
        const target = b.slot === "morning" ? mornMap : mainMap;
        (b.exercises || []).forEach(ex => {
          const vals = (Array.isArray(ex.reps)?ex.reps:[]).filter(v=>typeof v==='number'&&v>0);
          if (!target[ex.name]) target[ex.name] = { name: ex.name, target: ex.target||10, reps: [] };
          target[ex.name].reps.push(...vals);
        });
      });
      const { blocks: _b, ...rest } = s;
      return { ...rest, mornExercises: toFlat(Object.values(mornMap)), exercises: toFlat(Object.values(mainMap)) };
    }

    function lastTargetsFromSessions(sessions, beforeDate) {
      const out = {};
      [...sessions]
        .filter(s => !beforeDate || s.date < beforeDate)
        .sort((a,b) => b.date.localeCompare(a.date))
        .forEach(s => sessionExercises(s).forEach(ex => {
          if (!(ex.name in out) && ex.reps.length) out[ex.name] = ex.reps;
        }));
      return out;
    }
    const lastSession = sessions => [...(sessions||[])].sort((a,b) => a.date.localeCompare(b.date)).pop() || null;

    function calcTopExercises(sessions) {
      const cnt = {};
      sessions.forEach(s => sessionExercises(s).forEach(ex => {
        if (!cnt[ex.name]) cnt[ex.name] = { sets: 0, reps: 0 };
        cnt[ex.name].sets += exSetCount(ex);
        cnt[ex.name].reps += exTotalReps(ex);
      }));
      return Object.entries(cnt).sort((a,b) => b[1].reps - a[1].reps);
    }
    function calcExerciseProgression(sessions, name) {
      const out = [];
      [...sessions].sort((a,b) => a.date.localeCompare(b.date)).forEach(s => {
        const found = sessionExercises(s).find(ex => ex.name === name);
        if (found) out.push({ date: s.date, reps: exTotalReps(found) });
      });
      return out.slice(-10);
    }
    function calcWeeklyVolume(sessions) {
      const wks = {};
      sessions.forEach(s => {
        const d = new Date(s.date + "T12:00:00"); d.setDate(d.getDate() - d.getDay());
        const k = d.toISOString().slice(0, 10);
        wks[k] = (wks[k] || 0) + sessionTotalReps(s);
      });
      return Object.entries(wks).sort((a,b) => a[0].localeCompare(b[0])).slice(-10);
    }
    function calcLast28(sessions) {
      const map = {}; sessions.forEach(s => { map[s.date] = s; });
      return Array.from({ length: 28 }, (_,i) => ({ date: dateOffsetStr(27-i), entry: map[dateOffsetStr(27-i)] || null }));
    }

    // ─── Exercise categories ─────────────────────────────────────────────────────
    const EXERCISE_CATEGORIES = {
      "Pull":      ["Pull-ups", "Table Rows", "Muscle-ups", "Hanging Leg Raises"],
      "Push":     ["Push-ups", "Pike Push-ups", "Handstand Push-ups", "Dips", "Tricep Dips"],
      "Legs":     ["Squats", "Lunges"],
      "Core":     ["Crunches", "Leg Raises", "Plank (sets)", "L-Sit"],
      "Full Body": ["Burpees", "Mountain Climbers"],
    };

    // ─── Data shapes ─────────────────────────────────────────────────────────────
    const mkEx      = (name = "Push-ups", t = 10) => ({ name, target: t, reps: [t], done: false });
    const mkSup     = () => ({ creatine: false, midProtein: false, eveCombo: false });
    const mkSession = (date, type, exercises, mornExercises) => ({ date, type, mornExercises: mornExercises || [], exercises: exercises || [], supps: mkSup(), done: false, mornDone: false, notes: "" });

    // ─── Training blocks (grease the groove) ─────────────────────────────────────
    // A block = one batch of sets you do, then rest (cooldown) before the next block.
    // blocks are the source of truth for the training section; session.exercises is
    // kept as the flattened union of all block exercises so all existing
    // stats/gamification/history code keeps working unchanged.
    let _blockSeq = 0;
    const mkBlockId = () => `b${Date.now().toString(36)}${(_blockSeq++).toString(36)}`;
    const mkBlock   = (exercises) => ({ id: mkBlockId(), exercises: exercises || [mkEx("Pull-ups")], startedAt: null, collapsed: false });

    // Flatten blocks → a single exercises[] array, keeping one entry per block-exercise pair.
    // Same-named exercises across different blocks are NOT merged so the history editor
    // shows them as separate rows (e.g. 2 × Push-ups 3×10, not 1 × Push-ups 6×10).
    function flattenBlocks(blocks) {
      const result = [];
      (blocks || []).forEach(b => (b.exercises || []).forEach(ex => {
        const reps = (Array.isArray(ex.reps) ? ex.reps : []).filter(v => typeof v === 'number' && v > 0);
        result.push({ name: ex.name, target: ex.target || 10, reps, done: ex.done || false });
      }));
      return result;
    }

    // Read the training blocks out of a session, synthesising one block from the
    // flat exercises[] for sessions saved before blocks existed.
    function sessionBlocks(session) {
      if (Array.isArray(session?.trainBlocks) && session.trainBlocks.length) return session.trainBlocks;
      const exs = Array.isArray(session?.exercises) ? session.exercises : [];
      return [{ id: mkBlockId(), exercises: exs.length ? exs : [mkEx("Pull-ups")], startedAt: null, collapsed: false }];
    }

    function mkExFromTargets(exNames, lt) {
      return (exNames || []).map(name => {
        const prev = lt[name];
        const reps = Array.isArray(prev) && prev.length ? prev : [];
        // Pre-filled reps are suggestions from the last session; not yet done today.
        return { name, target: reps[0] || 10, reps, done: false };
      });
    }

    // ─── Tokens ──────────────────────────────────────────────────────────────────
    const ACC = "#b8f500", RED = "#ff5555", BG = "#080808", CARD = "#111", BDR = "#2a2a2a";
    const GOLD = "#ffd700", PURPLE = "#9b59b6";
    const mono = { fontFamily: "'JetBrains Mono', monospace" };
    const cond = { fontFamily: "'Barlow Condensed', sans-serif" };
    const lbl9 = { fontSize: 11, letterSpacing: 3, color: "#aaa" };

    // ─── Exercise mutators (schema 3 — flat array) ───────────────────────────────
    const mutSetRep = (E,ei,si,v) => E.map((ex,k)=>k!==ei?ex:{...ex,reps:ex.reps.map((r,l)=>l===si?v:r)});
    const mutDelRep = (E,ei,si)   => E.map((ex,k)=>k!==ei?ex:{...ex,reps:ex.reps.filter((_,l)=>l!==si)});
    const mutAddEx  = (E)         => [...E, mkEx()];
    const mutDelEx  = (E,ei)      => E.filter((_,k)=>k!==ei);
    const mutAddRep = (E,ei)      => E.map((ex,k)=>k!==ei?ex:{...ex,reps:[...ex.reps, ex.reps.length>0 ? ex.reps[ex.reps.length-1] : ex.target]});
    const mutName   = (E,ei,n)    => E.map((ex,k)=>k!==ei?ex:{...ex,name:n});
    const mutToggleDone = (E,ei)  => E.map((ex,k)=>k!==ei?ex:{...ex,done:!ex.done});
    const mutTarget = (E,ei,d)    => E.map((ex,k)=>k!==ei?ex:{...ex,target:Math.max(1,ex.target+d)});

    // ─── Block mutators ──────────────────────────────────────────────────────────
    // Each maps one block's exercises[] through an ExRow-style mutator.
    const mutBlockEx  = (B,bi,fn)   => B.map((b,k)=>k!==bi?b:{...b,exercises:fn(b.exercises)});
    const mutCheckBlock = (B,bi,ts) => B.map((b,k)=>k!==bi?b:{...b,startedAt:ts,collapsed:true,exercises:b.exercises.map(ex=>({...ex,done:true}))});
    const mutUncheckBlock = (B,bi) => B.map((b,k)=>k!==bi?b:{...b,startedAt:null,collapsed:false,exercises:b.exercises.map(ex=>({...ex,done:false}))});
    const mutToggleCollapse = (B,bi) => B.map((b,k)=>k!==bi?b:{...b,collapsed:!b.collapsed});
    const mutSetCollapseAll = (B,v) => B.map(b=>({...b,collapsed:v}));
    const mutBlockStart = (B,bi,ts) => B.map((b,k)=>k!==bi?b:{...b,startedAt:ts});
    const mutAddBlock = (B)         => [...B, mkBlock()];
    const mutDelBlock = (B,bi)      => B.filter((_,k)=>k!==bi);

    // ─── Rest Timer ──────────────────────────────────────────────────────────────
    function playDone() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const freqs = [880, 1100, 1320];
        freqs.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.value = freq;
          const t = ctx.currentTime + i * 0.18;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
          osc.start(t); osc.stop(t + 0.5);
        });
      } catch {}
    }

    function RestTimer({ seconds, onDone, onSkip }) {
      const endAt = useRef(Date.now() + seconds * 1000);
      const [remaining, setRemaining] = useState(seconds);
      const doneRef = useRef(false);

      useEffect(() => {
        const id = setInterval(() => {
          const left = Math.ceil((endAt.current - Date.now()) / 1000);
          if (left <= 0) {
            clearInterval(id);
            setRemaining(0);
            if (!doneRef.current) { doneRef.current = true; playDone(); onDone(); }
          } else {
            setRemaining(left);
          }
        }, 500);
        return () => clearInterval(id);
      }, []);

      const pct = ((seconds - remaining) / seconds) * 100;
      const urgentColor = remaining <= 10 ? RED : ACC;

      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.96)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", zIndex:5000 }} onClick={onSkip}>
          <div style={{ textAlign:"center", padding:"0 32px" }} onClick={e => e.stopPropagation()}>
            <div style={{ ...mono, fontSize:11, color:"#555", letterSpacing:4, marginBottom:24 }}>PAUSE</div>
            <div style={{ position:"relative", width:200, height:200, margin:"0 auto 32px" }}>
              <svg width="200" height="200" style={{ position:"absolute", inset:0 }}>
                <circle cx="100" cy="100" r="90" fill="none" stroke="#1a1a1a" strokeWidth="8" />
                <circle cx="100" cy="100" r="90" fill="none" stroke={urgentColor} strokeWidth="8"
                  strokeDasharray={`${2 * Math.PI * 90}`}
                  strokeDashoffset={`${2 * Math.PI * 90 * (pct / 100)}`}
                  strokeLinecap="round"
                  transform="rotate(-90 100 100)"
                  style={{ transition:"stroke-dashoffset 1s linear, stroke 0.3s" }}
                />
              </svg>
              <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
                <span style={{ ...mono, fontSize:72, fontWeight:700, color: urgentColor, lineHeight:1 }}>{remaining}</span>
              </div>
            </div>
            <button onClick={onSkip} style={{ padding:"14px 40px", background:"transparent", border:`1px solid #333`, color:"#888", borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:3, ...cond }}>SKIP</button>
          </div>
        </div>
      );
    }

    // ─── Cooldown countdown (block header) ───────────────────────────────────────
    // Shows how long is left until startedAt + cooldownMs. Ticks once per second.
    function fmtCountdown(ms) {
      if (ms <= 0) return "BEREIT";
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return h > 0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
    }
    function Cooldown({ startedAt, cooldownMs }) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      const remaining = startedAt + cooldownMs - now;
      const ready = remaining <= 0;
      return (
        <span style={{ ...mono, fontSize:14, fontWeight:700, color: ready ? ACC : "#e8a000", letterSpacing:1 }}>
          {ready ? "✓ BEREIT" : `⏳ ${fmtCountdown(remaining)}`}
        </span>
      );
    }

    // ─── Positive Insights ───────────────────────────────────────────────────────
    function calcInsights(snap, sessions) {
      const insights = [];
      if (!snap) return insights;
      const { streakState, stats } = snap;

      if (streakState?.current > 0 && streakState.current === streakState.longest && streakState.current > 3) {
        insights.push("Longest streak ever.");
      }
      if (stats?.totalWorkouts > 0 && stats.totalWorkouts % 10 === 0) {
        insights.push(`${stats.totalWorkouts} workouts completed.`);
      }
      if (stats?.totalPRs > 0 && stats.totalPRs % 5 === 0) {
        insights.push(`${stats.totalPRs} personal records broken.`);
      }

      // Weekly volume insight
      if (sessions && sessions.length >= 14) {
        const thisWeekStart = dateOffsetStr(6);
        const lastWeekStart = dateOffsetStr(13);
        const thisWeekReps  = sessions.filter(s => s.date >= thisWeekStart).reduce((a,s) => a + sessionTotalReps(s), 0);
        const lastWeekReps  = sessions.filter(s => s.date >= lastWeekStart && s.date < thisWeekStart).reduce((a,s) => a + sessionTotalReps(s), 0);
        if (lastWeekReps > 0 && thisWeekReps > lastWeekReps * 1.1) {
          insights.push("Most active week in recent history.");
        }
      }

      return insights.slice(0, 2);
    }

    // ─── DialPad ─────────────────────────────────────────────────────────────────
    function DialPad({ initialValue, onConfirm, onDelete, onClose }) {
      const [val, setVal] = useState(String(initialValue ?? ""));
      const press = d => setVal(v => v.length >= 4 ? v : v + d);
      const back  = () => setVal(v => v.slice(0, -1));
      const confirm = () => {
        const n = parseInt(val, 10);
        if (!isNaN(n) && n >= 1) onConfirm(n);
        else if (val === "") onConfirm(initialValue);
      };
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") { e.preventDefault(); onClose(); }
          else if (e.key === "Backspace") { e.preventDefault(); back(); }
          else if (e.key === "Enter") { e.preventDefault(); confirm(); }
          else if (e.key === "Delete") { e.preventDefault(); onDelete(); }
          else if (/^\d$/.test(e.key)) { e.preventDefault(); press(e.key); }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [val]);
      const btnStyle = (col) => ({
        flex:1, height:64, background:"#1a1a1a", border:`1px solid #333`,
        color: col || "#f0f0ed", fontSize:26, fontWeight:700, borderRadius:4,
        cursor:"pointer", ...mono, minWidth:0,
      });
      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", display:"flex", alignItems:"flex-end", zIndex:2000 }} onClick={onClose}>
          <div style={{ background:"#111", width:"100%", borderRadius:"14px 14px 0 0", padding:"20px 16px 32px" }} onClick={e => e.stopPropagation()}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", marginBottom:16, minHeight:56, background:"#0a0a0a", borderRadius:6, border:`1px solid #333` }}>
              <span style={{ ...mono, fontSize:40, fontWeight:700, color: val ? "#fff" : "#555", letterSpacing:2 }}>{val || "—"}</span>
            </div>
            <div style={{ display:"flex", gap:8, marginBottom:8 }}>
              {["1","2","3"].map(d => <button key={d} style={btnStyle()} onClick={() => press(d)}>{d}</button>)}
            </div>
            <div style={{ display:"flex", gap:8, marginBottom:8 }}>
              {["4","5","6"].map(d => <button key={d} style={btnStyle()} onClick={() => press(d)}>{d}</button>)}
            </div>
            <div style={{ display:"flex", gap:8, marginBottom:8 }}>
              {["7","8","9"].map(d => <button key={d} style={btnStyle()} onClick={() => press(d)}>{d}</button>)}
            </div>
            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <button style={btnStyle(RED)} onClick={onDelete}>✕</button>
              <button style={btnStyle()} onClick={() => press("0")}>0</button>
              <button style={btnStyle("#aaa")} onClick={back}>⌫</button>
            </div>
            <button onClick={confirm} style={{ width:"100%", padding:16, background:ACC, color:BG, border:"none", borderRadius:4, fontSize:18, fontWeight:900, letterSpacing:3, cursor:"pointer", ...cond }}>OK</button>
          </div>
        </div>
      );
    }

    // ─── RepTile ─────────────────────────────────────────────────────────────────
    function RepTile({ value, disabled, onClick }) {
      const displayVal = typeof value === 'number' ? value : (value ? "1" : "0");
      return (
        <button onClick={onClick} disabled={disabled} style={{
          width:54, height:54, borderRadius:4, flexShrink:0,
          border:`2px solid ${ACC}`,
          background:"#0d1a00",
          color: ACC,
          ...mono, fontWeight:700, fontSize:20,
          cursor: disabled ? "default" : "pointer",
        }}>{displayVal}</button>
      );
    }

    // ─── AddTile ─────────────────────────────────────────────────────────────────
    function AddTile({ onClick }) {
      return (
        <button onClick={onClick} style={{
          width:54, height:54, background:"transparent", border:`2px dashed #444`,
          color:"#aaa", borderRadius:4, cursor:"pointer", fontSize:24, lineHeight:1,
          fontWeight:700, ...mono, flexShrink:0,
        }}>+</button>
      );
    }

    // ─── ExRow ───────────────────────────────────────────────────────────────────
    function ExRow({ ex, disabled, onSetRep, onDelRep, onOpenModal, onDelete, canDelete, onAddRep, onRepAdded, onToggleDone }) {
      const [dialIdx, setDialIdx] = useState(null);
      const [pendingNewRep, setPendingNewRep] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const openDial = (i) => { if (!disabled) setDialIdx(i); };
      const closeDial = () => { setDialIdx(null); setPendingNewRep(false); };
      const confirmRep = (v) => { if (dialIdx !== null) { onSetRep(dialIdx, v); setDialIdx(null); setPendingNewRep(false); } };
      const deleteRep = () => { if (dialIdx !== null) { onDelRep(dialIdx); setDialIdx(null); setPendingNewRep(false); } };

      const openNewDial = () => {
        if (disabled) return;
        const newIdx = ex.reps.length;
        onAddRep();
        setPendingNewRep(true);
        setDialIdx(newIdx);
      };

      // Once the new rep lands in ex.reps, the dialIdx is valid — clear the pending flag.
      useEffect(() => {
        if (pendingNewRep && dialIdx !== null && dialIdx < ex.reps.length) {
          setPendingNewRep(false);
        }
      }, [ex.reps.length]);

      const isDialOpen = dialIdx !== null && (dialIdx < ex.reps.length || pendingNewRep);

      const dialInitial = isDialOpen
        ? (() => {
            const v = ex.reps[dialIdx];
            if (typeof v === 'number') return v;
            if (typeof v === 'boolean') return v ? ex.target : 0;
            return ex.reps.length > 0 ? ex.reps[ex.reps.length - 1] : ex.target;
          })()
        : null;

      const handleConfirmRep = (v) => {
        confirmRep(v);
        if (onRepAdded) onRepAdded();
      };

      return (
        <div style={{ marginBottom:18 }}>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:10 }}>
            <button onClick={() => !disabled && onToggleDone && onToggleDone()} title={ex.done ? "Done" : "Mark as done"} style={{ width:38, height:38, flexShrink:0, borderRadius:3, border:`2px solid ${ex.done ? ACC : "#666"}`, background: ex.done ? ACC : "transparent", cursor: disabled ? "default" : "pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
              {ex.done && <span style={{ color:BG, fontSize:18, fontWeight:700, lineHeight:1 }}>✓</span>}
            </button>
            <button onClick={onOpenModal} style={{ flex:1, background:"#1a1a1a", border:`1px solid #333`, color:"#e0e0e0", padding:"9px 12px", fontSize:14, ...cond, borderRadius:3, outline:"none", textAlign:"left", cursor:"pointer", fontWeight:500 }}>{ex.name}</button>
            {canDelete && <button onClick={() => setConfirmDelete(true)} title="Delete" style={{ width:38, height:38, background:CARD, border:`1px solid #444`, color:"#ff6b6b", borderRadius:3, cursor:"pointer", fontSize:18, lineHeight:1, display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>}
          </div>
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", opacity: ex.done ? 1 : 0.4 }}>
            {ex.reps.map((v,i) => (
              <RepTile key={i} value={v} disabled={disabled} onClick={() => openDial(i)} />
            ))}
            <AddTile onClick={openNewDial} />
          </div>
          {isDialOpen && (
            <DialPad
              initialValue={dialInitial}
              onConfirm={handleConfirmRep}
              onDelete={deleteRep}
              onClose={closeDial}
            />
          )}
          {confirmDelete && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:3000, padding:"0 24px" }} onClick={() => setConfirmDelete(false)}>
              <div style={{ background:"#111", border:`1px solid #333`, borderRadius:10, padding:"28px 24px", width:"100%", maxWidth:360 }} onClick={e => e.stopPropagation()}>
                <div style={{ fontSize:15, color:"#ddd", marginBottom:24, lineHeight:1.5, ...cond }}>"{ex.name}" entfernen?</div>
                <div style={{ display:"flex", gap:10 }}>
                  <button onClick={() => setConfirmDelete(false)} style={{ flex:1, padding:14, background:"transparent", border:`1px solid #444`, color:"#aaa", borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:2, ...cond }}>ABBRECHEN</button>
                  <button onClick={() => { setConfirmDelete(false); onDelete(); }} style={{ flex:1, padding:14, background:"#2a0000", border:`1px solid ${RED}`, color:RED, borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:2, fontWeight:700, ...cond }}>ENTFERNEN</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── ExerciseModal ───────────────────────────────────────────────────────────
    function ExerciseModal({ open, onClose, onSelect, recentlyUsed, customExercises, onAddCustom, exerciseImages, onImageUpdate }) {
      const [filter, setFilter]       = useState("Pull");
      const [search, setSearch]       = useState("");
      const [customName, setCustomName] = useState("");
      const [pendingImg, setPendingImg] = useState(null);
      const imgInputRef = useRef(null);

      useEffect(() => {
        if (open) {
          setFilter(customExercises.length > 0 ? "Custom" : recentlyUsed.length > 0 ? "Recent" : "Pull");
          setSearch(""); setCustomName("");
        }
      }, [open]);

      if (!open) return null;

      const allCats = {
        "Custom":  customExercises,
        ...(recentlyUsed.length > 0 ? { "Recent": recentlyUsed } : {}),
        ...EXERCISE_CATEGORIES,
      };

      const activeFilter = search.trim() ? null : filter;
      let displayed;
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        const pool = [...new Set([...customExercises, ...recentlyUsed, ...Object.values(EXERCISE_CATEGORIES).flat()])];
        displayed = pool.filter(ex => ex.toLowerCase().includes(q));
      } else {
        displayed = [...(allCats[filter] || [])];
      }

      const handleAdd = () => {
        if (!customName.trim()) return;
        onAddCustom(customName.trim()); onSelect(customName.trim()); setCustomName(""); onClose();
      };

      const handleImgBtn = (exName, e) => {
        e.stopPropagation(); setPendingImg(exName); imgInputRef.current?.click();
      };

      const handleImageFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file || !pendingImg) { setPendingImg(null); return; }
        e.target.value = '';
        try { const dataUrl = await resizeImageToDataURL(file, 96); onImageUpdate(pendingImg, dataUrl); }
        catch(err) { console.warn("Image resize failed:", err); }
        setPendingImg(null);
      };

      const catIcons = { "Custom":"★", "Recent":"⏱", "Pull":"↑", "Push":"→", "Legs":"⬇", "Core":"◎", "Full Body":"⊕" };

      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.94)", display:"flex", alignItems:"stretch", zIndex:2000 }} onClick={onClose}>
          <div style={{ background:"#111", width:"100%", display:"flex", flexDirection:"column" }} onClick={e => e.stopPropagation()}>

            {/* ── Header: title + search ── */}
            <div style={{ padding:"16px 20px 12px", borderBottom:`1px solid ${BDR}`, flexShrink:0 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                <div style={{ fontSize:22, fontWeight:900, letterSpacing:2, ...cond }}>SELECT EXERCISE</div>
                <button onClick={onClose} style={{ background:"none", border:"none", fontSize:30, cursor:"pointer", color:"#aaa", lineHeight:1, padding:"0 4px" }}>×</button>
              </div>
              <input type="search" value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Search…"
                style={{ width:"100%", padding:"10px 14px", background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", borderRadius:4, outline:"none", fontSize:15, boxSizing:"border-box" }} />
            </div>

            {/* ── Body: sidebar + card grid ── */}
            <div style={{ display:"flex", flex:1, minHeight:0, overflow:"hidden" }}>

              {/* Left: categories */}
              <div style={{ width:76, flexShrink:0, overflowY:"auto", borderRight:`1px solid ${BDR}`, padding:"6px 4px", display:"flex", flexDirection:"column", gap:3 }}>
                {Object.keys(allCats).map(cat => (
                  <button key={cat} onClick={() => { setFilter(cat); setSearch(""); }}
                    style={{ width:"100%", padding:"10px 2px", background: activeFilter===cat ? ACC : "transparent",
                      color: activeFilter===cat ? BG : "#777", border:"none", borderRadius:4,
                      cursor:"pointer", fontSize:11, letterSpacing:1, fontWeight:700, ...cond,
                      textAlign:"center", lineHeight:1.4 }}>
                    <div style={{ fontSize:17, marginBottom:2 }}>{catIcons[cat] || "·"}</div>
                    {cat}
                  </button>
                ))}
              </div>

              {/* Right: exercise cards */}
              <div style={{ flex:1, overflowY:"auto", padding:10 }}>
                {displayed.length === 0
                  ? <div style={{ padding:"60px 0", textAlign:"center", color:"#444", ...mono, fontSize:12, letterSpacing:3 }}>
                      {search.trim() ? "NO RESULTS" : "NO EXERCISES"}
                    </div>
                  : <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(clamp(140px, 18%, 200px), 1fr))", gap:8 }}>
                      {displayed.map(ex => (
                        <button key={ex} onClick={() => { onSelect(ex); onClose(); }}
                          style={{ position:"relative", background:CARD, border:`1px solid ${BDR}`, borderRadius:6,
                            cursor:"pointer", padding:0, overflow:"hidden", textAlign:"center",
                            display:"flex", flexDirection:"column" }}>
                          {/* Illustration area */}
                          <div style={{ height:80, background:"#0d0d0d", display:"flex", alignItems:"center",
                            justifyContent:"center", overflow:"hidden", flexShrink:0 }}>
                            {exerciseImages?.[ex]
                              ? <img src={exerciseImages[ex]} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
                              : <span style={{ fontSize:32, opacity:0.12 }}>◉</span>}
                          </div>
                          {/* Exercise name */}
                          <div style={{ padding:"8px 6px", fontSize:15, fontWeight:700, color:"#e0e0e0",
                            ...cond, letterSpacing:0.5, lineHeight:1.2, flex:1, display:"flex",
                            alignItems:"center", justifyContent:"center" }}>
                            {ex}
                          </div>
                          {/* Image upload button */}
                          <div onClick={e => handleImgBtn(ex, e)}
                            style={{ position:"absolute", top:4, right:4, width:22, height:22,
                              background:"rgba(0,0,0,0.72)", borderRadius:3, display:"flex",
                              alignItems:"center", justifyContent:"center", cursor:"pointer",
                              fontSize:11, color: exerciseImages?.[ex] ? "#aaa" : "#555",
                              border:`1px solid ${exerciseImages?.[ex] ? "#555" : "#333"}` }}
                            title="Upload image">
                            📷
                          </div>
                        </button>
                      ))}
                    </div>
                }
              </div>
            </div>

            {/* ── Footer: add custom exercise ── */}
            <div style={{ padding:"12px 16px 20px", borderTop:`1px solid ${BDR}`, flexShrink:0 }}>
              <div style={{ display:"flex", gap:8, marginBottom:6 }}>
                <input value={customName} onChange={e => setCustomName(e.target.value)}
                  onKeyDown={e => e.key==="Enter" && handleAdd()}
                  placeholder="Add new exercise…"
                  style={{ flex:1, padding:"10px 12px", background:"#1a1a1a", border:`1px solid ${BDR}`,
                    color:"#ccc", borderRadius:3, outline:"none", fontSize:14, boxSizing:"border-box" }} />
                <button onClick={handleAdd}
                  style={{ padding:"10px 16px", background: customName.trim() ? ACC : "#1a1a1a",
                    color: customName.trim() ? BG : "#444",
                    border:`1px solid ${customName.trim() ? ACC : BDR}`, borderRadius:3,
                    cursor: customName.trim() ? "pointer" : "default", fontWeight:700, fontSize:18 }}>✓</button>
              </div>
              <div style={{ ...mono, fontSize:11, color:"#444" }}>New exercises will appear permanently under "Custom"</div>
            </div>

            <input ref={imgInputRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleImageFile} />
          </div>
        </div>
      );
    }

    // ─── ExercisesSection ────────────────────────────────────────────────────────
    function ExercisesSection({ exercises, done, onSetRep, onDelRep, onAddExercise, onOpenModal, onDeleteExercise, onAddRep, onComplete, onRepAdded, onToggleDone, showComplete }) {
      const iconBtn = (icon, label, onClick, opts = {}) => (
        <button onClick={onClick} title={label} style={{
          flex:1, height:44, background:"transparent",
          border:`1px solid #2a2a2a`,
          color:"#888",
          borderRadius:4, cursor:"pointer",
          fontSize: opts.small ? 13 : 18, display:"flex", alignItems:"center", justifyContent:"center", lineHeight:1, letterSpacing: opts.small ? 1 : 0,
        }}>
          {icon}
        </button>
      );

      return (
        <div style={{ background:CARD, border:`1px solid ${BDR}`, borderRadius:6, marginBottom:12, padding:"16px 20px 20px" }}>
          {exercises.map((ex, ei) => (
            <ExRow key={ei} ex={ex} disabled={done}
              onSetRep={(si,v) => onSetRep(ei,si,v)}
              onDelRep={si => onDelRep(ei,si)}
              onOpenModal={() => onOpenModal(ei)}
              onDelete={() => onDeleteExercise(ei)}
              onAddRep={() => onAddRep(ei)}
              onRepAdded={onRepAdded}
              onToggleDone={() => onToggleDone(ei)}
              canDelete={exercises.length > 1}
            />
          ))}
          {!done && (
            <div style={{ display:"flex", gap:6, marginTop:12 }}>
              {iconBtn("＋", "EXERCISE", onAddExercise)}
              {showComplete && iconBtn("✓", "DONE", onComplete)}
            </div>
          )}
        </div>
      );
    }


    // ─── BlockCard (grease the groove) ───────────────────────────────────────────
    function BlockCard({ block, index, cooldownMs, onSetRep, onDelRep, onAddExercise, onOpenModal,
                         onDeleteExercise, onAddRep, onRepAdded, onToggleExDone, onCheck, onUncheck,
                         onToggleCollapse, onEditStart, canDeleteBlock, onDeleteBlock }) {
      const [confirmDel, setConfirmDel] = useState(false);
      const checked = block.startedAt !== null;
      const collapsed = block.collapsed;

      return (
        <div style={{ background:CARD, border:`1px solid ${checked ? "#2a4a00" : BDR}`, borderRadius:6, marginBottom:12, overflow:"hidden" }}>
          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", gap:8, padding:"12px 14px", borderBottom: collapsed ? "none" : `1px solid ${BDR}` }}>
            <button onClick={checked ? onUncheck : onCheck} title={checked ? "Done – tap to reset" : "Mark block as done"}
              style={{ width:34, height:34, flexShrink:0, borderRadius:3, border:`2px solid ${checked ? ACC : "#666"}`, background: checked ? ACC : "transparent", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
              {checked && <span style={{ color:BG, fontSize:18, fontWeight:700, lineHeight:1 }}>✓</span>}
            </button>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ ...mono, fontSize:11, color:"#888", letterSpacing:2 }}>BLOCK {index + 1}</div>
              {checked && (
                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:2 }}>
                  <Cooldown startedAt={block.startedAt} cooldownMs={cooldownMs} />
                  <button onClick={onEditStart} title="Edit start time" style={{ background:"none", border:"none", color:"#777", cursor:"pointer", fontSize:13, padding:0, lineHeight:1 }}>✎</button>
                </div>
              )}
            </div>
            <button onClick={onToggleCollapse} title={collapsed ? "Expand" : "Collapse"} style={{ width:34, height:34, flexShrink:0, background:"transparent", border:`1px solid #333`, color:"#888", borderRadius:3, cursor:"pointer", fontSize:14, lineHeight:1 }}>
              {collapsed ? "▾" : "▴"}
            </button>
            {canDeleteBlock && (
              <button onClick={() => setConfirmDel(true)} title="Delete block" style={{ width:34, height:34, flexShrink:0, background:CARD, border:`1px solid #444`, color:"#ff6b6b", borderRadius:3, cursor:"pointer", fontSize:18, lineHeight:1 }}>×</button>
            )}
          </div>

          {/* Body */}
          {!collapsed && (
            <div style={{ padding:"14px 18px 18px" }}>
              {block.exercises.map((ex, ei) => (
                <ExRow key={ei} ex={ex} disabled={checked}
                  onSetRep={(si,v) => onSetRep(ei,si,v)}
                  onDelRep={si => onDelRep(ei,si)}
                  onOpenModal={() => onOpenModal(ei)}
                  onDelete={() => onDeleteExercise(ei)}
                  onAddRep={() => onAddRep(ei)}
                  onRepAdded={onRepAdded}
                  onToggleDone={() => onToggleExDone(ei)}
                  canDelete={block.exercises.length > 1}
                />
              ))}
              {!checked && (
                <button onClick={onAddExercise} style={{ width:"100%", height:44, background:"transparent", border:`1px solid #2a2a2a`, color:"#888", borderRadius:4, cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center", lineHeight:1 }}>＋</button>
              )}
            </div>
          )}

          {confirmDel && (
            <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:3000, padding:"0 24px" }} onClick={() => setConfirmDel(false)}>
              <div style={{ background:"#111", border:`1px solid #333`, borderRadius:10, padding:"28px 24px", width:"100%", maxWidth:360 }} onClick={e => e.stopPropagation()}>
                <div style={{ fontSize:15, color:"#ddd", marginBottom:24, lineHeight:1.5, ...cond }}>Remove block {index + 1}?</div>
                <div style={{ display:"flex", gap:10 }}>
                  <button onClick={() => setConfirmDel(false)} style={{ flex:1, padding:14, background:"transparent", border:`1px solid #444`, color:"#aaa", borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:2, ...cond }}>CANCEL</button>
                  <button onClick={() => { setConfirmDel(false); onDeleteBlock(); }} style={{ flex:1, padding:14, background:"#2a0000", border:`1px solid ${RED}`, color:RED, borderRadius:4, cursor:"pointer", fontSize:13, letterSpacing:2, fontWeight:700, ...cond }}>REMOVE</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── SyncLed ──────────────────────────────────────────────────────────────────
    function SyncLed() {
      const [state, setState] = useState({ ...window._authState });
      useEffect(() => {
        const h = (e) => setState({ ...e.detail });
        window.addEventListener("authStateChanged", h);
        return () => window.removeEventListener("authStateChanged", h);
      }, []);

      if (!window._fbAuth) return null;

      const handleClick = async () => {
        if (!state.user) {
          await window._signInWithGoogle();
        } else if (!state.syncing) {
          await window.storage.syncFromCloud();
        }
      };

      const color = !state.user ? "#c0392b" : state.syncing ? "#e67e22" : "#27ae60";
      const title = !state.user ? "No sync – click to sign in" : state.syncing ? "Syncing…" : "Sync active – click to sync now";

      return (
        <button
          onClick={handleClick}
          title={title}
          style={{ background:"none", border:"none", cursor:"pointer", padding:0, display:"flex", alignItems:"center", justifyContent:"center", width:18, height:18 }}
        >
          <div style={{
            width:8, height:8, borderRadius:"50%",
            background: color,
            boxShadow: `0 0 4px 1px ${color}`,
            transition:"background 0.4s, box-shadow 0.4s"
          }} />
        </button>
      );
    }

    function HistoryExerciseEditor({ exs, setExs, label, lbl9, mono, BDR }) {
      const rowStyle = { display:"grid", gridTemplateColumns:"1fr 110px 28px", gap:6, alignItems:"center", marginBottom:6 };
      const parseReps = (str) => String(str).split(/[\s,]+/).map(s => parseInt(s,10)).filter(n => Number.isFinite(n) && n > 0);
      return (
        <>
          <div style={{ ...lbl9, marginBottom:8, marginTop:16 }}>{label}</div>
          <div style={{ ...rowStyle, marginBottom:4 }}>
            <div style={{ ...mono, fontSize:11, color:"#888" }}>EXERCISE</div>
            <div style={{ ...mono, fontSize:11, color:"#888", textAlign:"center" }}>REPS / SET</div>
            <div/>
          </div>
          {exs.map((ex, i) => (
            <div key={i} style={rowStyle}>
              <input type="text" value={ex.name} onChange={ev => setExs(exs.map((x,j)=>j===i?{...x,name:ev.target.value}:x))} placeholder="Exercise"
                style={{ background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", padding:"6px 8px", borderRadius:3, outline:"none", fontSize:12, width:"100%", boxSizing:"border-box", ...mono }} />
              <input type="text" inputMode="text"
                value={ex.repsRaw !== undefined ? ex.repsRaw : (ex.reps||[]).join(", ")}
                onChange={ev => setExs(exs.map((x,j)=>j===i?{...x,repsRaw:ev.target.value}:x))}
                onBlur={ev => {
                  const r = parseReps(ev.target.value);
                  setExs(exs.map((x,j)=>j===i?{...x,repsRaw:undefined,reps:r,target:r[0]||x.target||10}:x));
                }}
                placeholder="z.B. 8, 7, 6"
                style={{ background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", padding:"6px 8px", borderRadius:3, outline:"none", fontSize:12, width:"100%", boxSizing:"border-box", ...mono }} />
              <button onClick={() => setExs(exs.filter((_,j)=>j!==i))} style={{ background:"none", border:`1px solid #661111`, color:"#aa4444", borderRadius:3, cursor:"pointer", fontSize:14, height:30, width:28, lineHeight:1 }}>×</button>
            </div>
          ))}
          <button onClick={() => setExs([...exs, {name:"",target:10,reps:[]}])} style={{ width:"100%", padding:"6px 0", background:"transparent", border:`1px dashed ${BDR}`, color:"#666", borderRadius:3, cursor:"pointer", fontSize:12, marginBottom:4 }}>+ {label}</button>
        </>
      );
    }

    function HistoryDayEditModal({ entry, onClose, onSave, lbl9, mono, cond, ACC, BG, BDR }) {
      const [draft, setDraft] = useState(entry);

      useEffect(() => {
        setDraft(entry);
      }, [entry]);

      if (!draft) return null;

      const trainExs = Array.isArray(draft.exercises) ? draft.exercises : [];
      const mExs     = Array.isArray(draft.mornExercises) ? draft.mornExercises : [];
      const setTrainExs = (v) => setDraft(prev => ({ ...prev, exercises: v }));
      const setMExs     = (v) => setDraft(prev => ({ ...prev, mornExercises: v }));

      return (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", zIndex:3000, display:"flex", alignItems:"flex-end" }} onClick={onClose}>
          <div style={{ background:"#111", width:"100%", borderRadius:"14px 14px 0 0", maxHeight:"80vh", display:"flex", flexDirection:"column" }} onClick={ev => ev.stopPropagation()}>
