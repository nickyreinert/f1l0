            <div style={{ padding:"16px 20px 12px", borderBottom:`1px solid ${BDR}`, display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
              <div style={{ ...mono, fontSize:11, color:ACC, letterSpacing:2 }}>{draft.date}</div>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ display:"flex", borderRadius:3, overflow:"hidden", border:`1px solid ${BDR}` }}>
                  {["A","B"].map(t => <button key={t} onClick={() => setDraft(prev => ({...prev, type:t}))} style={{ padding:"4px 12px", background: draft.type===t ? (t==="A"?ACC:"#ff5555") : "transparent", border:"none", color: draft.type===t ? BG : "#888", fontSize:11, fontWeight:700, cursor:"pointer", ...mono }}>{t}</button>)}
                </div>
                <button onClick={onClose} style={{ background:"none", border:"none", color:"#666", fontSize:20, cursor:"pointer", lineHeight:1, padding:"0 4px" }}>×</button>
              </div>
            </div>
            <div style={{ overflowY:"auto", padding:"16px 20px 32px", flex:1, minHeight:0 }}>
              <div style={{ ...mono, fontSize:11, color:"#666", marginBottom:8 }}>Separate reps per set with commas — e.g. <span style={{ color:"#999" }}>8, 7, 6</span> = 3 sets.</div>
              <HistoryExerciseEditor exs={mExs} setExs={setMExs} label="MORNING WORKOUT" lbl9={lbl9} mono={mono} BDR={BDR} />
              <HistoryExerciseEditor exs={trainExs} setExs={setTrainExs} label="TRAINING" lbl9={lbl9} mono={mono} BDR={BDR} />
              <button onClick={() => onSave({ ...draft, exercises: trainExs, mornExercises: mExs })} style={{ width:"100%", padding:14, background:ACC, color:BG, border:"none", borderRadius:4, cursor:"pointer", fontSize:14, fontWeight:900, letterSpacing:3, ...cond, marginTop:16 }}>SAVE</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── App ─────────────────────────────────────────────────────────────────────
    function App() {
      const [ready, setReady]               = useState(false);
      const [lastTrainDate, setLastTrainDate] = useState(null);
      const [trainType, setTrainType]       = useState("A");
      // Training section
      const [exercises, setExercises]       = useState([]);
      const [trainBlocks, setTrainBlocks]   = useState([]);
      const [trainSupps, setTrainSupps]     = useState(mkSup());
      const [trainDone, setTrainDone]       = useState(false);
      // Grease-the-groove cooldown between blocks (ms). Default 4h.
      const [cooldownMs, setCooldownMs]     = useState(4 * 3600000);
      const [tmpCooldownMin, setTmpCooldownMin] = useState(240);
      const [editBlockIdx, setEditBlockIdx] = useState(null);
      // Frühsport section
      const [mornExercises, setMornExercises] = useState([]);
      const [mornDone, setMornDone]           = useState(false);
      // Rest timer
      const [restTimer, setRestTimer]       = useState(null);
      const [restTimerKey, setRestTimerKey] = useState(0);
      const [restSecs, setRestSecs]         = useState(60);
      const [tmpRestSecs, setTmpRestSecs]   = useState(60);
      // Modal
      const [modalOpen, setModalOpen]       = useState(false);
      const [modalTarget, setModalTarget]   = useState(null); // { section: "train"|"morn", ei }
      const [recentEx, setRecentEx]         = useState([]);
      const [sessions, setSessions]         = useState([]);
      const [customExercises, setCustomEx]  = useState([]);
      const [exerciseImages, setExerciseImages] = useState({});
      const [supplements, setSupplements]   = useState([]);
      const [tmpSupplements, setTmpSupplements] = useState([]);
      const [suppDeleteConfirm, setSuppDeleteConfirm] = useState(null);
      const [suppDragIdx, setSuppDragIdx]     = useState(null);
      const [suppDragOver, setSuppDragOver]   = useState(null);
      const suppDragRef = useRef({ fromIdx: null });

      const [rpgSnap, setRpgSnap]           = useState(null);
      const [levelUpEvent, setLevelUpEvent] = useState(null);
      const [xpEvents, setXpEvents]         = useState(null);
      const [achQueue, setAchQueue]         = useState([]);
      const [animateXP, setAnimateXP]       = useState(false);

      const refreshSnap = useCallback(async () => {
        const snap = await window.Gamification.getSnapshot();
        setRpgSnap(snap);
      }, []);

      const initApp = useCallback(async () => {
          await window._syncReady;
          const cfg = await load("cfg") || {};
          const rawAll = await load("sessions") || [];
          const all = rawAll.map(migrateSession);
          if (all.some((s,i) => s !== rawAll[i])) await save("sessions", all);

          const rs = cfg.restSecs ?? 60;
          setRestSecs(rs); setTmpRestSecs(rs);
          const cdMs = cfg.cooldownMs ?? 4 * 3600000;
          setCooldownMs(cdMs); setTmpCooldownMin(Math.round(cdMs / 60000));
          setCustomEx(cfg.customExercises || []);
          const imgs = await load("exerciseImages") || {};
          setExerciseImages(imgs);
          const supp = cfg.supplements || [];
          setSupplements(supp); setTmpSupplements(supp);

          const t = todayStr();
          const prior = all.filter(s => s.date !== t);
          const lastPrev = lastSession(prior);
          if (lastPrev) setLastTrainDate(lastPrev.date);

          let today = all.find(s => s.date === t);
          if (!today) {
            const nt = computeType(lastPrev?.date, lastPrev?.type);
            const lt = lastTargetsFromSessions(prior, t);
            // Pre-fill training exercises from last same-type session
            const lastSameType = [...prior].reverse().find(s => s.type === nt);
            const trainNames = (lastSameType?.exercises || []).map(e => e.name);
            const trainExs = trainNames.length ? mkExFromTargets(trainNames, lt) : [mkEx("Pull-ups", lt["Pull-ups"]?.[0] ?? lt["Klimmzüge"]?.[0] ?? 10)];
            // Pre-fill Frühsport from last session that had mornExercises
            const lastMorn = [...prior].reverse().find(s => s.mornExercises?.length);
            const mornNames = (lastMorn?.mornExercises || []).map(e => e.name);
            const mornExs = mornNames.length ? mkExFromTargets(mornNames, lt) : [mkEx("Push-ups", lt["Push-ups"]?.[0] ?? lt["Liegestütze"]?.[0] ?? 10)];
            today = mkSession(t, nt, trainExs, mornExs);
            const next = [...prior, today];
            // Only persist a freshly-created default session once the user has
            // actually interacted; persisting here would push a blank today over
            // good cloud data before sync. Keep it in React state only for now.
            setSessions(next);
          } else {
            setSessions(all);
          }

          setTrainType(today.type);
          const blocks = sessionBlocks(today);
          setTrainBlocks(blocks);
          setExercises(flattenBlocks(blocks));
          setTrainSupps(today.supps ?? mkSup());
          setTrainDone(today.done ?? false);
          setMornExercises(today.mornExercises || []);
          setMornDone(today.mornDone ?? false);

          await refreshSnap();
          setReady(true);
      }, []);

      useEffect(() => {
        initApp();
        // Re-init if a later cloud sync brings down newer data
        const onSync = () => initApp();
        window.addEventListener("cloudSyncComplete", onSync);
        return () => window.removeEventListener("cloudSyncComplete", onSync);
      }, [initApp]);

      const persistSelectedDay = async (patch) => {
        const t = headerDate;
        const all = await load("sessions") || [];
        const existing = all.find(s => s.date === t) || mkSession(t, trainType, [], []);
        // Stamp every write so cross-device merge can pick the newest edit per date.
        const updated = { ...existing, ...patch, updatedAt: Date.now() };
        const next = [...all.filter(s => s.date !== t), updated].sort((a,b) => a.date.localeCompare(b.date));
        await save("sessions", next);
        setSessions(next);
        return updated;
      };

      const saveExercises = (exs, su, d) => persistSelectedDay({
        type: trainType, exercises: exs ?? exercises,
        supps: su ?? trainSupps, done: d ?? trainDone,
      });
      // Source of truth for training is blocks; exercises[] is the derived flat union.
      const saveTrainBlocks = (blocks, su, d) => persistSelectedDay({
        type: trainType, trainBlocks: blocks ?? trainBlocks, exercises: flattenBlocks(blocks ?? trainBlocks),
        supps: su ?? trainSupps, done: d ?? trainDone,
      });
      const saveMorn = (exs, md) => persistSelectedDay({
        mornExercises: exs ?? mornExercises, mornDone: md ?? mornDone,
      });

      // Training handlers (block-based). Each commits new blocks + derived exercises.
      const commitBlocks = (n) => { setTrainBlocks(n); setExercises(flattenBlocks(n)); saveTrainBlocks(n); };
      const onBlkSetRep   = (bi,ei,si,v) => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutSetRep(E,ei,si,v)));
      const onBlkDelRep   = (bi,ei,si)   => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutDelRep(E,ei,si)));
      const onBlkAddEx    = (bi)         => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutAddEx(E)));
      const onBlkDelEx    = (bi,ei)      => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutDelEx(E,ei)));
      const onBlkAddRep   = (bi,ei)      => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutAddRep(E,ei)));
      const onBlkExName   = (bi,ei,nm)   => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutName(E,ei,nm)));
      const onBlkExDone   = (bi,ei)      => commitBlocks(mutBlockEx(trainBlocks,bi,E=>mutToggleDone(E,ei)));
      const onCheckBlock  = (bi)         => commitBlocks(mutCheckBlock(trainBlocks,bi,Date.now()));
      const onUncheckBlock= (bi)         => commitBlocks(mutUncheckBlock(trainBlocks,bi));
      const onBlkCollapse = (bi)         => commitBlocks(mutToggleCollapse(trainBlocks,bi));
      const onBlkSetStart = (bi,ts)      => commitBlocks(mutBlockStart(trainBlocks,bi,ts));
      const onAddBlock    = ()           => commitBlocks(mutAddBlock(trainBlocks));
      const onDelBlock    = (bi)         => commitBlocks(mutDelBlock(trainBlocks,bi));
      const allCollapsed  = trainBlocks.length > 0 && trainBlocks.every(b => b.collapsed);
      const onToggleAllCollapse = () => commitBlocks(mutSetCollapseAll(trainBlocks, !allCollapsed));
      // Frühsport handlers
      const onMornSetRep = (ei,si,v) => { const n=mutSetRep(mornExercises,ei,si,v); setMornExercises(n); saveMorn(n); };
      const onMornDelRep = (ei,si)   => { const n=mutDelRep(mornExercises,ei,si);   setMornExercises(n); saveMorn(n); };
      const onMornAddEx  = ()        => { const n=mutAddEx(mornExercises);           setMornExercises(n); saveMorn(n); };
      const onMornDelEx  = (ei)      => { const n=mutDelEx(mornExercises,ei);        setMornExercises(n); saveMorn(n); };
      const onMornAddRep = (ei)      => { const n=mutAddRep(mornExercises,ei);       setMornExercises(n); saveMorn(n); };
      const onMornToggleDone = (ei)  => { const n=mutToggleDone(mornExercises,ei);   setMornExercises(n); saveMorn(n); };

      const addCustomExercise = async (name) => {
        if (customExercises.includes(name)) return;
        const updated = [...customExercises, name];
        setCustomEx(updated);
        const cfg = await load("cfg") || {};
        await save("cfg", { ...cfg, customExercises: updated });
      };

      const updateExerciseImage = async (exName, dataUrl) => {
        const updated = { ...exerciseImages, [exName]: dataUrl };
        setExerciseImages(updated);
        await save("exerciseImages", updated);
      };

      const selectExercise = (exName) => {
        if (!modalTarget) return;
        const { section, ei } = modalTarget;

        // Look up last logged reps for this exercise name from history
        const prior = sessions.filter(s => s.date < headerDate);
        const lt = lastTargetsFromSessions(prior, headerDate);
        const lastReps = lt[exName];

        // Apply name + historical reps suggestion (only if exercise not yet done today)
        const applyEx = (ex) => {
          const base = { ...ex, name: exName };
          if (!ex.done && lastReps && lastReps.length) {
            return { ...base, target: lastReps[0], reps: lastReps };
          }
          return base;
        };

        if (section === "morn") {
          const n = mornExercises.map((ex, k) => k !== ei ? ex : applyEx(ex));
          setMornExercises(n); saveMorn(n);
        } else if (section === "block") {
          const newBlocks = mutBlockEx(trainBlocks, modalTarget.bi, E => E.map((ex, k) => k !== ei ? ex : applyEx(ex)));
          commitBlocks(newBlocks);
        } else {
          const n = exercises.map((ex, k) => k !== ei ? ex : applyEx(ex));
          setExercises(n); saveExercises(n);
        }
        setRecentEx(prev => [exName, ...prev.filter(e => e !== exName)].slice(0,8));
        setModalOpen(false);
      };

      // ─── History edit / selected day ───────────────────────────────────────
      const [histOffset, setHistOffset] = useState(0);
      const [editEntry, setEditEntry]   = useState(null);
      const [headerDayOffset, setHeaderDayOffset] = useState(0);

      const headerDate = useMemo(() => {
        const d = new Date();
        d.setDate(d.getDate() + headerDayOffset);
        return d.toISOString().slice(0, 10);
      }, [headerDayOffset]);
      const isViewingToday = headerDate === todayStr();

      const selectedSession = useMemo(() => {
        return sessions.find(s => s.date === headerDate) || mkSession(headerDate, "A", [], []);
      }, [sessions, headerDate]);

      useEffect(() => {
        const visible = migrateSession(selectedSession);
        setTrainType(visible.type);
        const blocks = sessionBlocks(visible);
        setTrainBlocks(blocks);
        setExercises(flattenBlocks(blocks));
        setTrainSupps(visible.supps ?? mkSup());
        setTrainDone(visible.done ?? false);
        setMornExercises(visible.mornExercises || []);
        setMornDone(visible.mornDone ?? false);
      }, [selectedSession]);

      const fireGamificationEvents = (events, newLevel) => {
        const levelUpEv = events.find(e => e.type === "levelUp");
        const achEv     = events.find(e => e.type === "achievements");
        const xpEv      = events.filter(e => ["xp","pr","improvement","weeklyBonus"].includes(e.type));
        if (levelUpEv) { setLevelUpEvent(newLevel); }
        else { if (xpEv.length > 0) { setXpEvents(xpEv); setTimeout(() => setXpEvents(null), 3500); } }
        if (achEv?.list?.length > 0) setAchQueue(q => [...q, ...achEv.list]);
        setAnimateXP(true);
        setTimeout(() => setAnimateXP(false), 2000);
      };

      // Only confirmed (done) exercises count toward XP — pre-filled suggestions don't.
      const gamSessions = (exs) => exs.filter(ex => ex.done).map(ex => ({ name: ex.name, reps: exTotalReps(ex) }));

      const completeMorning = async () => {
        if (mornDone || !isViewingToday) return;
        setMornDone(true);
        await saveMorn(null, true);
        const result = await window.Gamification.processWorkoutComplete({
          exerciseSessions: gamSessions(mornExercises), isMorning: true, date: todayStr(),
        });
        await refreshSnap();
        fireGamificationEvents(result.events, result.newLevel);
      };

      const completeDay = async () => {
        if (trainDone || !isViewingToday) return;
        setTrainDone(true);
        await saveExercises(null, null, true);
        setLastTrainDate(todayStr());
        const result = await window.Gamification.processWorkoutComplete({
          exerciseSessions: gamSessions([...mornExercises, ...exercises]),
          isMorning: false, date: todayStr(),
        });
        await refreshSnap();
        fireGamificationEvents(result.events, result.newLevel);
      };

      // Auto-complete a section (award XP) once every exercise in it is confirmed.
      useEffect(() => {
        if (!ready || !isViewingToday || mornDone) return;
        if (mornExercises.length > 0 && mornExercises.every(ex => ex.done)) completeMorning();
      }, [ready, isViewingToday, mornDone, mornExercises]);

      useEffect(() => {
        if (!ready || !isViewingToday || trainDone || trainType !== "A") return;
        // Day completes once every training block has been checked off.
        if (trainBlocks.length > 0 && trainBlocks.every(b => b.startedAt !== null)) completeDay();
      }, [ready, isViewingToday, trainDone, trainType, trainBlocks]);

      const toggleSupp = k => {
        const ns = { ...trainSupps, [k]: !trainSupps[k] };
        setTrainSupps(ns); saveExercises(null, ns, null);
      };

      const exportData = async () => JSON.stringify({
        schema: 3, cfg: await load("cfg"), sessions: await load("sessions"), exportedAt: new Date().toISOString(),
      }, null, 2);

      const legacyToSessions = (parsed) => {
        const byDate = {};
        const ensure = (date, type) => (byDate[date] ||= mkSession(date, type || "A", [], []));
        const toExs = (arr) => {
          const map = {};
          (arr || []).forEach(ex => {
            const reps = Array.isArray(ex.sets) ? ex.sets
                       : (ex.sets > 0 ? Array(ex.sets).fill(Math.round((ex.reps||0)/ex.sets)) : (ex.reps ? [ex.reps] : []));
            if (!map[ex.name]) map[ex.name] = { name: ex.name, target: reps[0]||10, reps: [] };
            map[ex.name].reps.push(...reps);
          });
          return Object.values(map);
        };
        (parsed.history || []).forEach(e => {
          const s = ensure(e.date, e.type);
          s.mornExercises = toExs(e.mornExercises);
          s.exercises = toExs(e.exercises);
          if (e.notes) s.notes = e.notes;
        });
        return Object.values(byDate).sort((a,b) => a.date.localeCompare(b.date));
      };

      const importData = async (parsed) => {
        let sess;
        if ((parsed.schema === 2 || parsed.schema === 3) && Array.isArray(parsed.sessions)) {
          sess = parsed.sessions.map(migrateSession);
        } else {
          sess = legacyToSessions(parsed);
        }
        localStorage.setItem("tp_sessions", JSON.stringify(sess));
        if (parsed.cfg) localStorage.setItem("tp_cfg", JSON.stringify(parsed.cfg));
        ["tp_day","tp_morn","tp_history"].forEach(k => localStorage.removeItem(k));
        try { await window.storage._pushAllToCloud(); } catch(e) {}
        setSessions(sess);
        await refreshSnap();
      };

      const typeColor = trainType === "A" ? ACC : RED;

      const openHeaderDayEditor = () => {
        const existing = sessions.find(s => s.date === headerDate);
        setEditEntry(existing ? { ...existing } : mkSession(headerDate, "A", []));
      };

      const saveHistoryEntry = async (updated) => {
        // The history editor edits the flat exercises[] directly; discard any stale
        // block structure so the edited flat list becomes the single source again.
        const { trainBlocks: _drop, ...rest } = updated;
        const migrated = { ...migrateSession(rest), updatedAt: Date.now() };
        const next = [...sessions.filter(s => s.date !== migrated.date), migrated]
          .sort((a,b) => a.date.localeCompare(b.date));
        setSessions(next);
        await save("sessions", next);
        if (migrated.date === headerDate) {
          const blocks = sessionBlocks(migrated);
          setTrainBlocks(blocks);
          setExercises(flattenBlocks(blocks));
          setMornExercises(migrated.mornExercises || []);
          setTrainSupps(migrated.supps ?? mkSup());
          setTrainDone(migrated.done ?? false);
          setMornDone(migrated.mornDone ?? false);
        }
        setEditEntry(null);
      };

      // ─── Settings + Stats modal ───────────────────────────────────────────────
      const [menuOpen, setMenuOpen] = useState(false);
      useEffect(() => {
        document.body.style.overflow = menuOpen ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [menuOpen]);
      const [menuTab, setMenuTab]   = useState("stats");
      const [copyOk, setCopyOk]     = useState(false);
      const [importJson, setImportJson] = useState("");
      const [importErr, setImportErr]   = useState("");
      const [cloudState, setCloudState] = useState({ ...window._authState });
      const modalOrderRef = useRef({ exercise: 0, startTime: 0, menu: 0, history: 0 });
      const modalSeqRef = useRef(0);
      const prevOpenRef = useRef({ exercise: false, startTime: false, menu: false, history: false });

      useEffect(() => {
        const currentOpen = {
          exercise: modalOpen,
          startTime: editBlockIdx !== null,
          menu: menuOpen,
          history: !!editEntry,
        };
        Object.keys(currentOpen).forEach((key) => {
          if (currentOpen[key] && !prevOpenRef.current[key]) {
            modalOrderRef.current[key] = ++modalSeqRef.current;
          }
        });
        prevOpenRef.current = currentOpen;
      }, [modalOpen, editBlockIdx, menuOpen, editEntry]);

      useEffect(() => {
        const handleEscape = (e) => {
          if (e.key !== "Escape") return;
          const openModals = [
            { key: "exercise", open: modalOpen, close: () => setModalOpen(false) },
            { key: "startTime", open: editBlockIdx !== null, close: () => setEditBlockIdx(null) },
            { key: "menu", open: menuOpen, close: () => setMenuOpen(false) },
            { key: "history", open: !!editEntry, close: () => setEditEntry(null) },
          ].filter((m) => m.open);
          if (!openModals.length) return;
          const top = openModals.reduce((a, b) => (
            modalOrderRef.current[b.key] > modalOrderRef.current[a.key] ? b : a
          ));
          e.preventDefault();
          top.close();
        };
        window.addEventListener("keydown", handleEscape);
        return () => window.removeEventListener("keydown", handleEscape);
      }, [modalOpen, editBlockIdx, menuOpen, editEntry]);

      useEffect(() => {
        const h = (e) => setCloudState({ ...e.detail });
        window.addEventListener("authStateChanged", h);
        return () => window.removeEventListener("authStateChanged", h);
      }, []);

      useEffect(() => {
        const guard = (e) => {
          if (window._authState?.syncing) { e.preventDefault(); e.returnValue = "Sync still running."; }
        };
        window.addEventListener("beforeunload", guard);
        return () => window.removeEventListener("beforeunload", guard);
      }, []);

      const MenuModal = () => {
        const streak    = calcStreak(sessions);
        const topEx     = calcTopExercises(sessions);
        const weekVol   = calcWeeklyVolume(sessions);
        const maxWeek   = Math.max(...weekVol.map(w => w[1]), 1);
        const totalDays = sessions.length;
        const totalReps = sessions.reduce((a,s) => a + sessionTotalReps(s), 0);
        const totalSets = sessions.reduce((a,s) => a + sessionExercises(s).reduce((x,ex) => x + exSetCount(ex), 0), 0);

        const handleCopy = async () => {
          const json = await exportData();
          try { await navigator.clipboard.writeText(json); setCopyOk(true); setTimeout(() => setCopyOk(false), 2500); }
          catch { setImportJson(json); setImportErr("Clipboard blocked — JSON pasted below"); }
        };
        const handleImport = async () => {
          setImportErr("");
          try {
            const parsed = JSON.parse(importJson);
            if (!parsed || typeof parsed !== "object") throw new Error("not an object");
            await importData(parsed);
            const n = (parsed.sessions?.length || parsed.history?.length || 0);
            setImportErr("✓ " + n + " entries imported");
            setImportJson("");
          } catch(err) {
            setImportErr("Error: " + err.message);
          }
        };

        const TAB = (id, label) => (
          <button key={id} onClick={() => setMenuTab(id)} style={{ flex:1, padding:"12px 0", background:"transparent", border:"none", borderBottom:`2px solid ${menuTab===id ? ACC : "transparent"}`, color: menuTab===id ? "#f0f0ed" : "#aaa", fontSize:11, letterSpacing:2, cursor:"pointer", ...cond, fontWeight:700 }}>{label}</button>
        );
        const KPI = ({ label, val, unit, large }) => (
          <div style={{ background:"#0a0a0a", border:`1px solid ${BDR}`, borderRadius:6, padding:"14px 12px" }}>
            <div style={{ ...lbl9, marginBottom:6 }}>{label}</div>
            <div style={{ ...mono, fontSize: large ? 30 : 22, fontWeight:700, color:ACC, lineHeight:1 }}>{val}</div>
            <div style={{ fontSize:12, color:"#aaa", marginTop:4 }}>{unit}</div>
          </div>
        );

        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", display:"flex", alignItems:"stretch", zIndex:1500 }} onClick={() => setMenuOpen(false)}>
            <div style={{ background:"#111", width:"100%", borderRadius:0, height:"100%", display:"flex", flexDirection:"column" }} onClick={e => e.stopPropagation()}>
              <div style={{ display:"flex", borderBottom:`1px solid ${BDR}`, flexShrink:0 }}>
                {TAB("stats","STATS")}{TAB("exercises","EXERCISES")}{TAB("settings","SETTINGS")}{TAB("data","DATA")}
              </div>
              <div style={{ overflowY:"auto", padding:"20px 20px 40px", flex:1, minHeight:0 }}>

                {menuTab === "stats" && (sessions.length === 0
                  ? <div style={{ padding:"60px 0", textAlign:"center" }}><div style={{ ...mono, fontSize:12, color:"#aaa", letterSpacing:3 }}>NO DATA YET</div></div>
                  : <>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:8 }}>
                        <KPI label="STREAK" val={streak.cur} unit="Training Days" large /><KPI label="RECORD" val={streak.best} unit="Training Days" large /><KPI label="SESSIONS" val={totalDays} unit="total" large />
                      </div>
                      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:20 }}>
                        <KPI label="TOTAL REPS" val={totalReps.toLocaleString("en")} unit="reps" /><KPI label="TOTAL SETS" val={totalSets.toLocaleString("en")} unit="completed" />
                      </div>
                      {(() => {
                        const map = {}; sessions.forEach(s => { map[s.date] = s; });
                        const endOffset = histOffset * 28;
                        const days = Array.from({ length: 28 }, (_,i) => {
                          const d = new Date(); d.setDate(d.getDate() - endOffset - (27 - i));
                          const date = d.toISOString().slice(0,10);
                          return { date, entry: map[date] || null };
                        });
                        const rangeLabel = histOffset === 0 ? "LAST 28 DAYS" : `${histOffset * 28}–${(histOffset+1)*28} DAYS AGO`;
                        return <>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                            <div style={{ ...lbl9 }}>{rangeLabel}</div>
                            <div style={{ display:"flex", gap:6 }}>
                              <button onClick={() => setHistOffset(o => o+1)} style={{ background:"none", border:`1px solid ${BDR}`, color:"#888", borderRadius:3, padding:"2px 8px", cursor:"pointer", fontSize:14, lineHeight:1 }}>‹</button>
                              <button onClick={() => setHistOffset(o => Math.max(0,o-1))} disabled={histOffset===0} style={{ background:"none", border:`1px solid ${histOffset===0?"#222":BDR}`, color:histOffset===0?"#333":"#888", borderRadius:3, padding:"2px 8px", cursor:histOffset===0?"default":"pointer", fontSize:14, lineHeight:1 }}>›</button>
                            </div>
                          </div>
                          <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:4, marginBottom:8 }}>
                            {days.map(({ date, entry }) => (
                              <button key={date} onClick={() => setEditEntry(entry ? { ...entry } : mkSession(date, "A", []))}
                                style={{ height:36, borderRadius:3, background: !entry ? "#1a1a1a" : entry.type==="A" ? "#1e4d08" : "#08304d", border:`1px solid ${!entry ? "#2a2a2a" : entry.type==="A" ? "#3a8a10" : "#1a6a9a"}`, cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:1, padding:0 }}>
                                <span style={{ ...mono, fontSize:9, color: !entry ? "#666" : entry.type==="A" ? "#7acc20" : "#20aacc", lineHeight:1 }}>{date.slice(8)}</span>
                                {entry && <span style={{ ...mono, fontSize:8, color:"#999", lineHeight:1 }}>{entry.type}</span>}
                              </button>
                            ))}
                          </div>
                        </>;
                      })()}
                      {weekVol.length > 1 && <>
                        <div style={{ ...lbl9, marginBottom:10, marginTop:20 }}>REPS PER WEEK</div>
                        <div style={{ display:"flex", gap:6, alignItems:"flex-end", height:90 }}>
                          {weekVol.map(([week, vol]) => (
                            <div key={week} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:3 }}>
                              <div style={{ ...mono, fontSize:8, color:"#888" }}>{vol >= 1000 ? `${(vol/1000).toFixed(1)}k` : vol}</div>
                              <div style={{ width:"100%", background:ACC, borderRadius:"3px 3px 0 0", height:`${Math.max(4,(vol/maxWeek)*64)}px`, opacity:0.6 }} />
                              <div style={{ ...mono, fontSize:8, color:"#666" }}>{week.slice(5)}</div>
                            </div>
                          ))}
                        </div>
                      </>}
                    </>
                )}

                {menuTab === "exercises" && (topEx.length === 0
                  ? <div style={{ padding:"60px 0", textAlign:"center" }}><div style={{ ...mono, fontSize:12, color:"#aaa", letterSpacing:3 }}>NO DATA YET</div></div>
                  : <>
                      <div style={{ ...lbl9, marginBottom:16 }}>TOTAL VOLUME BY EXERCISE</div>
                      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))", gap:10 }}>
                        {topEx.map(([name, { sets, reps }]) => {
                          const prog = calcExerciseProgression(sessions, name);
                          const maxR = Math.max(...prog.map(p => p.reps), 1);
                          return (
                            <div key={name} style={{ background:"#0a0a0a", border:`1px solid ${BDR}`, borderRadius:6, padding:16 }}>
                              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:10 }}>
                                <span style={{ fontSize:16, fontWeight:700, color:"#ddd" }}>{name}</span>
                                <span style={{ ...mono, fontSize:12, color:"#bbb" }}>{reps.toLocaleString("en")} reps · {sets} sets</span>
                              </div>
                              <div style={{ height:4, background:"#1a1a1a", borderRadius:2, marginBottom: prog.length > 1 ? 14 : 0 }}>
                                <div style={{ height:4, background:ACC, opacity:0.5, width:`${(reps / topEx[0][1].reps) * 100}%`, borderRadius:2 }} />
                              </div>
                              {prog.length > 1 && <>
                                <div style={{ ...lbl9, marginBottom:6 }}>PROGRESSION</div>
                                <div style={{ display:"flex", gap:3, alignItems:"flex-end", height:40 }}>
                                  {prog.map((p,i) => (
                                    <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2 }}>
                                      <div style={{ width:"100%", background: i===prog.length-1 ? ACC : "#2a4a00", borderRadius:"2px 2px 0 0", height:`${Math.max(3,(p.reps/maxR)*30)}px`, opacity: i===prog.length-1 ? 0.85 : 0.5 }} />
                                      <div style={{ ...mono, fontSize:7, color:"#888" }}>{p.reps}</div>
                                    </div>
                                  ))}
                                </div>
                              </>}
                            </div>
                          );
                        })}
                      </div>
                    </>
                )}

                {menuTab === "settings" && <>
                  <div style={{ ...lbl9, marginBottom:14 }}>REST TIMER AFTER SET</div>
                  <div style={{ display:"flex", borderRadius:4, overflow:"hidden", border:`1px solid ${BDR}`, marginBottom:8 }}>
                    <button onClick={() => setTmpRestSecs(v => Math.max(10, v-10))} style={{ width:72, height:72, background:CARD, border:"none", color:"#bbb", fontSize:30, cursor:"pointer", ...mono }}>−</button>
                    <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", background:"#1a1a1a", ...mono, fontSize:34, fontWeight:700 }}>{tmpRestSecs}s</div>
                    <button onClick={() => setTmpRestSecs(v => v+10)} style={{ width:72, height:72, background:CARD, border:"none", color:"#bbb", fontSize:30, cursor:"pointer", ...mono }}>+</button>
                  </div>
                  <div style={{ ...mono, fontSize:13, color:"#aaa", marginBottom:28 }}>Countdown starts after each set</div>

                  <div style={{ ...lbl9, marginBottom:14 }}>COOLDOWN BETWEEN BLOCKS</div>
                  <div style={{ display:"flex", borderRadius:4, overflow:"hidden", border:`1px solid ${BDR}`, marginBottom:8 }}>
                    <button onClick={() => setTmpCooldownMin(v => Math.max(15, v-15))} style={{ width:72, height:72, background:CARD, border:"none", color:"#bbb", fontSize:30, cursor:"pointer", ...mono }}>−</button>
                    <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", background:"#1a1a1a", ...mono, fontSize:30, fontWeight:700 }}>
                      {Math.floor(tmpCooldownMin/60)}h {String(tmpCooldownMin%60).padStart(2,"0")}m
                    </div>
                    <button onClick={() => setTmpCooldownMin(v => v+15)} style={{ width:72, height:72, background:CARD, border:"none", color:"#bbb", fontSize:30, cursor:"pointer", ...mono }}>+</button>
                  </div>
                  <div style={{ ...mono, fontSize:13, color:"#aaa", marginBottom:28 }}>Break between training blocks (Grease the Groove)</div>

                  <div style={{ ...lbl9, marginBottom:14, marginTop:20 }}>SUPPLEMENTS</div>
                  <div style={{ marginBottom:20 }}>
                    {tmpSupplements.map((supp, si) => (
                      <div
                        key={si}
                        data-supp-row={si}
                        style={{
                          background: suppDragIdx === si ? "#1a2800" : suppDragOver === si ? "#111800" : CARD,
                          border: `1px solid ${suppDragIdx === si ? ACC : BDR}`,
                          borderRadius:6, padding:"6px 8px", marginBottom:6,
                          display:"flex", gap:6, alignItems:"center",
                          opacity: suppDragIdx === si ? 0.6 : 1,
                          transition:"background 0.12s, opacity 0.12s",
                        }}
                      >
                        {/* Drag handle */}
                        <div
                          style={{ cursor:"grab", color:"#555", fontSize:20, lineHeight:1, padding:"0 2px", touchAction:"none", userSelect:"none", flexShrink:0 }}
                          onPointerDown={(e) => {
                            e.currentTarget.setPointerCapture(e.pointerId);
                            suppDragRef.current.fromIdx = si;
                            setSuppDragIdx(si);
                            setSuppDeleteConfirm(null);
                          }}
                          onPointerMove={(e) => {
                            if (suppDragRef.current.fromIdx === null) return;
                            const el = document.elementFromPoint(e.clientX, e.clientY);
                            const row = el?.closest('[data-supp-row]');
                            if (row) {
                              const idx = parseInt(row.getAttribute('data-supp-row'), 10);
                              if (!isNaN(idx)) setSuppDragOver(idx);
                            }
                          }}
                          onPointerUp={() => {
                            const from = suppDragRef.current.fromIdx;
                            if (from !== null && suppDragOver !== null && from !== suppDragOver) {
                              const ns = [...tmpSupplements];
                              const [item] = ns.splice(from, 1);
                              ns.splice(suppDragOver, 0, item);
                              setTmpSupplements(ns);
                            }
                            suppDragRef.current.fromIdx = null;
                            setSuppDragIdx(null);
                            setSuppDragOver(null);
                          }}
                        >⠿</div>
                        {/* Name */}
                        <input type="text" placeholder="Name" value={supp.name}
                          onChange={e => { const ns=[...tmpSupplements]; ns[si]={...ns[si],name:e.target.value}; setTmpSupplements(ns); }}
                          style={{ flex:2, minWidth:0, background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", padding:"6px 8px", borderRadius:3, outline:"none", fontSize:12, boxSizing:"border-box" }} />
                        {/* Volume/Amount */}
                        <input type="text" placeholder="Amount" value={supp.amount || ""}
                          onChange={e => { const ns=[...tmpSupplements]; ns[si]={...ns[si],amount:e.target.value}; setTmpSupplements(ns); }}
                          style={{ flex:1, minWidth:0, background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", padding:"6px 8px", borderRadius:3, outline:"none", fontSize:12, boxSizing:"border-box" }} />
                        {/* Time */}
                        <input type="text" placeholder="Time" value={supp.time || ""}
                          onChange={e => { const ns=[...tmpSupplements]; ns[si]={...ns[si],time:e.target.value}; setTmpSupplements(ns); }}
                          style={{ flex:1, minWidth:0, background:"#1a1a1a", border:`1px solid ${BDR}`, color:"#ddd", padding:"6px 8px", borderRadius:3, outline:"none", fontSize:12, boxSizing:"border-box" }} />
                        {/* Delete */}
                        {suppDeleteConfirm === si ? (
                          <div style={{ display:"flex", gap:4, flexShrink:0 }}>
                            <button onClick={() => { setTmpSupplements(tmpSupplements.filter((_,j)=>j!==si)); setSuppDeleteConfirm(null); }}
                              style={{ height:30, padding:"0 8px", background:"#661111", border:"none", color:"#ffaaaa", borderRadius:3, cursor:"pointer", fontSize:11, letterSpacing:1, ...cond, fontWeight:700 }}>YES</button>
                            <button onClick={() => setSuppDeleteConfirm(null)}
                              style={{ height:30, padding:"0 8px", background:"transparent", border:`1px solid #333`, color:"#666", borderRadius:3, cursor:"pointer", fontSize:11, letterSpacing:1, ...cond }}>NO</button>
                          </div>
                        ) : (
                          <button onClick={() => setSuppDeleteConfirm(si)}
                            style={{ width:30, height:30, background:"transparent", border:`1px solid #661111`, color:"#aa4444", borderRadius:3, cursor:"pointer", fontSize:16, lineHeight:1, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
                        )}
                      </div>
                    ))}
                    <button onClick={() => setTmpSupplements([...tmpSupplements, { name:"", amount:"", time:"" }])}
                      style={{ width:"100%", padding:12, background:CARD, border:`1px dashed ${BDR}`, color:"#888", borderRadius:4, cursor:"pointer", fontSize:13, ...cond }}>+ ADD SUPPLEMENT</button>
                  </div>

                  <button onClick={() => {
                    const rs = Math.max(10, tmpRestSecs);
                    const cdMs = Math.max(15, tmpCooldownMin) * 60000;
                    setRestSecs(rs); setSupplements(tmpSupplements); setCooldownMs(cdMs);
                    load("cfg").then(cfg => save("cfg", { ...(cfg||{}), restSecs: rs, cooldownMs: cdMs, supplements: tmpSupplements }));
                    setMenuOpen(false);
                  }} style={{ background:ACC, color:BG, border:"none", padding:16, fontSize:18, fontWeight:900, letterSpacing:3, width:"100%", borderRadius:4, cursor:"pointer", ...cond }}>SAVE</button>
                </>}

                {menuTab === "data" && <>
                  {window._fbAuth && <>
                    <div style={{ ...lbl9, marginBottom:10 }}>CLOUD BACKUP</div>
                    {cloudState.user ? (
                      <div style={{ background:"#0a1a0a", border:`1px solid #1a3a1a`, borderRadius:6, padding:"14px 16px", marginBottom:24, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                        <div>
                          <div style={{ ...mono, fontSize:11, color: cloudState.syncing ? "#ffa500" : "#4a8c4a", letterSpacing:3, marginBottom:4 }}>
                            {cloudState.syncing ? "SYNCING…" : "BACKUP ACTIVE"}
                          </div>
                          <div style={{ fontSize:12, color:"#888" }}>{cloudState.user.displayName || cloudState.user.email}</div>
                        </div>
                        <button onClick={window._signOut} style={{ background:"transparent", border:`1px solid #333`, color:"#666", borderRadius:4, padding:"8px 14px", cursor:"pointer", fontSize:11, letterSpacing:2, ...cond }}>SIGN OUT</button>
                      </div>
                    ) : (
                      <div style={{ marginBottom:24 }}>
                        <button onClick={window._signInWithGoogle} style={{ width:"100%", padding:16, background:"#111a2a", border:`1px solid #2a3a5a`, color:"#8899cc", fontSize:14, fontWeight:700, letterSpacing:2, borderRadius:4, cursor:"pointer", ...cond, marginBottom:8 }}>
                          SIGN IN WITH GOOGLE
                        </button>
                        <div style={{ ...mono, fontSize:12, color:"#aaa" }}>Automatically back up data to Google Cloud.</div>
                      </div>
                    )}
                  </>}
                  <div style={{ ...lbl9, marginBottom:14 }}>EXPORT</div>
                  <button onClick={handleCopy} style={{ width:"100%", padding:16, background: copyOk ? "#1a3a00" : CARD, border:`1px solid ${copyOk ? "#3a8a10" : BDR}`, color: copyOk ? ACC : "#ccc", fontSize:14, fontWeight:700, letterSpacing:2, borderRadius:4, cursor:"pointer", ...cond, marginBottom:6 }}>
                    {copyOk ? "✓ COPIED TO CLIPBOARD" : "COPY DATA → JSON"}
                  </button>
                  <div style={{ ...mono, fontSize:13, color:"#aaa", marginBottom:28 }}>cfg · sessions — everything as JSON (schema 3).</div>
                  <div style={{ ...lbl9, marginBottom:14 }}>IMPORT</div>
                  <textarea value={importJson} onChange={e => { setImportJson(e.target.value); setImportErr(""); }} placeholder="Paste JSON here…" style={{ width:"100%", height:110, background:"#1a1a1a", border:`1px solid ${importErr ? RED : BDR}`, color:"#ccc", padding:12, borderRadius:4, outline:"none", resize:"none", ...mono, fontSize:11, boxSizing:"border-box" }} />
                  {importErr && <div style={{ ...mono, fontSize:10, color: importErr.startsWith("✓") ? ACC : RED, marginTop:4 }}>{importErr}</div>}
                  <button onClick={handleImport} style={{ width:"100%", padding:16, background: importJson ? "#1a1a00" : CARD, border:`1px solid ${importJson ? "#4a4a00" : BDR}`, color: importJson ? "#cccc00" : "#555", fontSize:14, fontWeight:700, letterSpacing:2, borderRadius:4, cursor: importJson ? "pointer" : "default", ...cond, marginTop:8 }}>
                    IMPORT DATA
                  </button>
                </>}
              </div>
            </div>
          </div>
        );
      };

      if (!ready) return <div style={{ background:BG, minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", ...mono, color:"#888", fontSize:13 }}>···</div>;

      const miniLevel  = rpgSnap?.level || 1;
      const miniPct    = rpgSnap?.progress?.pct || 0;
      const miniStreak = rpgSnap?.streakState?.current || 0;

      return (
        <div style={{ background:BG, minHeight:"100vh", color:"#f0f0ed", ...cond, maxWidth:480, margin:"0 auto", paddingBottom:100 }}>
          {/* ── Header ── */}
          <div style={{ padding:"20px 20px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
              <button onClick={() => { setTmpRestSecs(restSecs); setTmpCooldownMin(Math.round(cooldownMs/60000)); setMenuTab("stats"); setMenuOpen(true); }} style={{ background:"#0d1a00", border:`1px solid #2a4a00`, borderRadius:6, padding:"8px 10px", cursor:"pointer", textAlign:"left", minWidth:90 }}>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <div style={{ ...mono, fontSize:12, color:ACC, fontWeight:700 }}>LV {miniLevel}</div>
                  {miniStreak > 0 && <div style={{ ...mono, fontSize:12, color:"#aaa" }}>🔥{miniStreak}</div>}
                </div>
                <div style={{ height:3, background:"#1a1a1a", borderRadius:2, marginTop:4, overflow:"hidden" }}>
                  <div style={{ height:"100%", background:ACC, width:`${miniPct}%`, borderRadius:2, transition:"width 0.8s ease" }}/>
                </div>
              </button>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <SyncLed />
                <button onClick={() => { setTmpRestSecs(restSecs); setTmpCooldownMin(Math.round(cooldownMs/60000)); setMenuTab("stats"); setMenuOpen(true); }} style={{ background:"none", border:`1px solid #333`, color:"#bbb", cursor:"pointer", padding:"8px 10px", fontSize:18, borderRadius:4 }}>⚙</button>
              </div>
            </div>

            {(() => {
              const daysSince = (lastTrainDate && lastTrainDate !== todayStr())
                ? Math.floor((new Date(todayStr()+"T12:00:00") - new Date(lastTrainDate+"T12:00:00")) / 86400000)
                : null;
              const isRest = trainType === "B";
              const urgency = !isRest ? 0 : (daysSince ?? 0);
              const urgencyColor = urgency <= 1 ? typeColor : urgency === 2 ? "#e8a000" : urgency === 3 ? "#e85000" : "#ff2222";
              const urgencyTag = isRest && urgency >= 2
                ? urgency === 2 ? "TRAIN!" : urgency === 3 ? "TRAIN NOW!" : urgency === 4 ? "YOU MUST TRAIN!" : "LAZY BASTARD!"
                : null;
              return <>
                <div style={{ marginTop:4, lineHeight:0.88 }}>
                  <div style={{ fontSize:80, fontWeight:900, letterSpacing:-3, color:urgencyColor }}>{isRest ? "REST" : "TRAIN"}</div>
                  {urgencyTag && <div style={{ fontSize:22, fontWeight:900, letterSpacing:2, color:urgencyColor, marginTop:4 }}>{urgencyTag}</div>}
                </div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:6 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <button onClick={() => setHeaderDayOffset(o => o - 1)} title="Previous day" style={{ background:"transparent", border:`1px solid #333`, color:"#888", borderRadius:3, padding:"2px 8px", cursor:"pointer", fontSize:14, lineHeight:1 }}>‹</button>
                    <button onClick={openHeaderDayEditor} title="Edit day" style={{ ...lbl9, background:"none", border:"none", cursor:"pointer", color:"#aaa" }}>{fmtDate(headerDate).toUpperCase()}</button>
                    <button onClick={() => setHeaderDayOffset(0)} title="Go to today" disabled={headerDayOffset === 0} style={{ background:"transparent", border:`1px solid ${headerDayOffset === 0 ? "#222" : "#333"}`, color: headerDayOffset === 0 ? "#333" : "#888", borderRadius:3, padding:"2px 8px", cursor: headerDayOffset === 0 ? "default" : "pointer", fontSize:10, letterSpacing:1, lineHeight:1, ...cond }}>TODAY</button>
                    <button onClick={() => setHeaderDayOffset(o => Math.min(0, o + 1))} title="Next day" disabled={headerDayOffset === 0} style={{ background:"transparent", border:`1px solid ${headerDayOffset === 0 ? "#222" : "#333"}`, color: headerDayOffset === 0 ? "#333" : "#888", borderRadius:3, padding:"2px 8px", cursor: headerDayOffset === 0 ? "default" : "pointer", fontSize:14, lineHeight:1 }}>›</button>
                  </div>
                </div>
              </>;
            })()}
          </div>
          <div style={{ height:1, background:BDR }} />

          {/* ── Morning Workout ── */}
          <div style={{ padding:"20px 20px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontSize:26, fontWeight:900, letterSpacing:1, color:"#aaa" }}>MORNING WORKOUT</div>
            </div>
            <ExercisesSection
              exercises={mornExercises}
              done={false}
              onSetRep={onMornSetRep}
              onDelRep={onMornDelRep}
              onAddExercise={onMornAddEx}
              onOpenModal={(ei) => { setModalTarget({ section:"morn", ei }); setModalOpen(true); }}
              onDeleteExercise={onMornDelEx}
              onAddRep={onMornAddRep}
              onToggleDone={onMornToggleDone}
              onRepAdded={() => { setRestTimer(restSecs); setRestTimerKey(k => k+1); }}
              showComplete={false}
            />
          </div>
          <div style={{ height:1, background:BDR, margin:"20px 0 0" }} />

          {/* ── Training ── */}
          <div style={{ padding:"20px 20px 0" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
              <div style={{ fontSize:26, fontWeight:900, letterSpacing:1, color: typeColor }}>TRAINING</div>
              {trainType === "A" && trainBlocks.length > 1 && (
                <button onClick={onToggleAllCollapse} style={{ background:"transparent", border:`1px solid #333`, color:"#888", borderRadius:4, cursor:"pointer", padding:"6px 12px", fontSize:10, letterSpacing:2, ...cond, fontWeight:700 }}>
                  {allCollapsed ? "EXPAND ALL" : "COLLAPSE ALL"}
                </button>
              )}
            </div>
            {trainType === "A" && <>
              {trainBlocks.map((block, bi) => (
                <BlockCard
                  key={block.id}
                  block={block}
                  index={bi}
                  cooldownMs={cooldownMs}
                  onSetRep={(ei,si,v) => onBlkSetRep(bi,ei,si,v)}
                  onDelRep={(ei,si) => onBlkDelRep(bi,ei,si)}
                  onAddExercise={() => onBlkAddEx(bi)}
                  onOpenModal={(ei) => { setModalTarget({ section:"block", bi, ei }); setModalOpen(true); }}
                  onDeleteExercise={(ei) => onBlkDelEx(bi,ei)}
                  onAddRep={(ei) => onBlkAddRep(bi,ei)}
                  onRepAdded={() => { setRestTimer(restSecs); setRestTimerKey(k => k+1); }}
                  onToggleExDone={(ei) => onBlkExDone(bi,ei)}
                  onCheck={() => onCheckBlock(bi)}
                  onUncheck={() => onUncheckBlock(bi)}
                  onToggleCollapse={() => onBlkCollapse(bi)}
                  onEditStart={() => setEditBlockIdx(bi)}
                  canDeleteBlock={trainBlocks.length > 1}
                  onDeleteBlock={() => onDelBlock(bi)}
                />
              ))}
              <button onClick={onAddBlock} style={{ width:"100%", padding:14, background:"transparent", border:`1px dashed #444`, color:"#aaa", borderRadius:6, cursor:"pointer", fontSize:14, letterSpacing:2, ...cond, fontWeight:700, marginBottom:12 }}>
                ＋ ADD BLOCK
              </button>
            </>}
            {trainType === "B" && (
              <div style={{ background:CARD, border:`1px solid ${BDR}`, borderRadius:6, padding:20, marginBottom:12 }}>
                <div style={{ fontSize:13, color:RED, letterSpacing:4, marginBottom:12 }}>REST DAY — NO TRAINING</div>
                <div style={{ fontSize:15, color:"#aaa", lineHeight:1.7 }}>Tendons and nervous system repair micro-injuries. No pull-ups, not even briefly.</div>
                <div style={{ marginTop:20, paddingTop:16, borderTop:`1px solid ${BDR}`, display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:8, height:8, borderRadius:"50%", background:"#2c6e35", flexShrink:0 }} />
                  <span style={{ fontSize:13, color:"#888", letterSpacing:1 }}>Cycling &amp; cardio allowed</span>
                </div>
              </div>
            )}
          </div>

          {supplements.length > 0 && (
            <div style={{ padding:"16px 20px 0" }}>
              <div style={{ ...lbl9, marginBottom:4 }}>SUPPLEMENTS</div>
              {supplements.map((supp, si) => {
                // Include time + index so two supplements with the same name
                // (e.g. "Protein" at lunch and evening) get distinct keys.
                const suppKey = `${si}_${supp.name}_${supp.time || ""}`.toLowerCase().replace(/\s+/g, "_");
                const isChecked = trainSupps[suppKey] || false;
                return (
                  <div key={suppKey} onClick={() => toggleSupp(suppKey)} style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 0", borderBottom:`1px solid ${BDR}`, cursor:"pointer" }}>
                    <div style={{ width:22, height:22, borderRadius:3, border:`2px solid ${isChecked ? ACC : "#888"}`, background: isChecked ? ACC : "transparent", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
                      {isChecked && <span style={{ color:BG, fontSize:13, fontWeight:700, lineHeight:1 }}>✓</span>}
                    </div>
                    <div style={{ flex:1 }}>
                      <span style={{ fontSize:16, color: isChecked ? "#555" : "#ddd", textDecoration: isChecked ? "line-through" : "none" }}>{supp.name} {supp.amount && `— ${supp.amount}`}</span>
                      {supp.time && <div style={{ fontSize:13, color:"#bbb", marginTop:2 }}>{supp.time}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <ExerciseModal open={modalOpen} onClose={() => setModalOpen(false)} onSelect={selectExercise} recentlyUsed={recentEx} customExercises={customExercises} onAddCustom={addCustomExercise} exerciseImages={exerciseImages} onImageUpdate={updateExerciseImage} />
          {editBlockIdx !== null && trainBlocks[editBlockIdx]?.startedAt != null && (
            <StartTimeModal
              startedAt={trainBlocks[editBlockIdx].startedAt}
              onConfirm={(ts) => { onBlkSetStart(editBlockIdx, ts); setEditBlockIdx(null); }}
              onClose={() => setEditBlockIdx(null)}
            />
          )}
          {menuOpen && MenuModal()}

          {/* ── History entry edit modal ── */}
          {editEntry && (
            <HistoryDayEditModal
              entry={editEntry}
              onClose={() => setEditEntry(null)}
              onSave={saveHistoryEntry}
              lbl9={lbl9}
              mono={mono}
              cond={cond}
              ACC={ACC}
              BG={BG}
              BDR={BDR}
            />
          )}

          {/* ── Rest Timer ── */}
          {restTimer !== null && (
            <RestTimer
              key={restTimerKey}
              seconds={restTimer}
              onDone={() => setRestTimer(null)}
              onSkip={() => setRestTimer(null)}
            />
          )}

          {/* ── Gamification overlays ── */}
          {levelUpEvent && (
            <LevelUpOverlay level={levelUpEvent} onDone={() => { setLevelUpEvent(null); setXpEvents(null); }} />
          )}
          {xpEvents && !levelUpEvent && (
            <XPPopup events={xpEvents} onDone={() => setXpEvents(null)} />
          )}
          {achQueue.length > 0 && (
            <AchievementToast achievement={achQueue[0]} onDone={() => setAchQueue(q => q.slice(1))} />
          )}
          <div style={{ textAlign:"center", padding:"24px 0 8px", fontSize:11, color:"#444" }}>
            <a href="https://github.com/nickyreinert/f1l0" target="_blank" rel="noopener noreferrer" style={{ color:"#555", textDecoration:"none", letterSpacing:2 }}>ABOUT</a>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <script>
    (() => {
      const source = document.getElementById('app-script')?.textContent || '';
      const compiled = Babel.transform(source, {
        filename: 'app.jsx',
        presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
      }).code;
      const script = document.createElement('script');
      script.text = compiled;
      document.body.appendChild(script);
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const isLocalhost = ["localhost", "127.0.0.1"].includes(window.location.hostname);
        if (isLocalhost) {
          try {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((reg) => reg.unregister()));
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          } catch {}
          return;
        }
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
