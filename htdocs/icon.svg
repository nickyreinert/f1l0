<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- background -->
  <rect width="16" height="16" fill="#111"/>
  <!-- upper canopy (bright lime) -->
  <rect x="7" y="3" width="1" height="1" fill="#b8f500"/>
  <rect x="6" y="4" width="3" height="1" fill="#b8f500"/>
  <rect x="5" y="5" width="5" height="1" fill="#b8f500"/>
  <rect x="4" y="6" width="7" height="1" fill="#b8f500"/>
  <!-- lower canopy (darker lime) -->
  <rect x="5" y="7" width="5" height="1" fill="#6abf00"/>
  <rect x="4" y="8" width="7" height="1" fill="#6abf00"/>
  <rect x="6" y="9" width="4" height="1" fill="#6abf00"/>
  <!-- trunk + base (brown) -->
  <rect x="7" y="10" width="2" height="2" fill="#8b5e3c"/>
  <rect x="6" y="12" width="4" height="1" fill="#8b5e3c"/>
</svg>
